[package]
name = "hs-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Federation and security: server discovery, key server, X-Matrix request signing/verification, the federation transport server and client, server ACLs (track 06)"

[dependencies]
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
rand.workspace = true
futures.workspace = true
http.workspace = true
bytes.workspace = true
regex.workspace = true
async-trait.workspace = true
hickory-resolver.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
ruma.workspace = true
ipnet.workspace = true
hs-model = { path = "../hs-model" }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
hs-http = { path = "../hs-http" }
hs-config = { path = "../hs-config" }
# Added by track 06 (fourth session): `hs_state::auth::{check_event_auth,
# check_auth_events_selection, expected_auth_types}` is the one real room-version auth-rules
# engine in the workspace, and `crate::join`/`crate::inbound` reuse it directly against a
# `StateFetch` built from `RoomDataSource`'s current-state read, rather than re-deriving the
# power-level/join-rule/membership rules a second time for inbound federation writes.
hs-state = { path = "../hs-state" }

[dev-dependencies]
hs-testkit = { path = "../hs-testkit" }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
rcgen.workspace = true
