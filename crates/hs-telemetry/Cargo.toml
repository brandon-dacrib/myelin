[package]
name = "hs-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tracing, structured logs, request ids, Prometheus metrics, health probes, OpenTelemetry and Sentry for the homeserver (track 12)"

[features]
default = []
# OpenTelemetry OTLP export of traces (and optionally logs) over gRPC.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
]
# Sentry error and panic reporting fed from `tracing` events.
sentry = ["dep:sentry"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std", "time"] }
tracing-log = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
pin-project-lite = "0.2"
prometheus-client = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros"] }

opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["grpc-tonic", "trace", "logs", "tls-ring", "tls-webpki-roots"] }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }

sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }

[package.metadata.docs.rs]
all-features = true
