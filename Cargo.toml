[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91"
repository = ""
publish = false

# Shared dependency versions. Tracks add entries here only when missing, and record the addition in their status file.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
ruma = { version = "0.15", features = ["signatures", "state-res", "client-api", "federation-api", "appservice-api", "push-gateway-api", "identity-service-api", "rand", "unstable-msc4186"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
http = "1"
tower = "0.5"
rand = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
proptest = "1"
criterion = "0.5"
prometheus-client = "0.25"
serde_yaml_ng = "0.10"
schemars = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha1 = "0.10"
# Added by track 01 (storage): embedded store, PostgreSQL client and pool, temp dirs for tests.
fjall = { version = "3", features = ["bytes_1"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tempfile = "3"
object_store = { version = "0.14", features = ["aws"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
http-body-util = "0.1"

# Added by track 03 (cluster): stable hashing for rendezvous and shard mapping, mesh TLS and HTTP/2 plumbing, constant-time compare, test certificates.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http2", "client"] }
subtle = "2"
rcgen = "0.14"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
lto = "thin"
codegen-units = 4
