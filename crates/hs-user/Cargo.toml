[package]
name = "hs-user"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "hs-user: the user session actor, /sync v2, account data, joined_rooms and publicRooms (track 05)"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
ruma = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hs-model = { path = "../hs-model" }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
hs-auth = { path = "../hs-auth" }
hs-http = { path = "../hs-http" }
hs-room = { path = "../hs-room" }
# Added this session (track 05) per docs/rfcs/0013-e2ee-sync-extensions.md: GET /sync needs
# hs-e2e's store traits (to-device queue, device-list stream, one-time/fallback key counts) to
# populate `to_device`, `device_lists`, `device_one_time_keys_count` and
# `device_unused_fallback_key_types`. hs-user depends only on hs-e2e's storage trait surface
# (`hs_e2e::store`), never its routes/state.
hs-e2e = { path = "../hs-e2e" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
hs-testkit = { path = "../hs-testkit" }
# See crates/hs-room/Cargo.toml's identical note: hs-testkit's FakeClock needs tokio's
# `test-util` feature, which hs-testkit's own Cargo.toml deliberately does not request.
tokio = { workspace = true, features = ["test-util"] }
