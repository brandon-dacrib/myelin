      tags:
      - Events
      security:
      - OAuth2:
        - admin:read
      description: text/event-stream. See RFC 0004 section 10 for the frame format, reconnect semantics (Last-Event-ID), the replay buffer, stream.reset, and the type taxonomy. The stream is filtered to what the token's scopes allow.
      parameters:
      - name: types
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Repeatable; exact type or a prefix.* glob.
      - name: resource_type
        in: query
        schema:
          type: string
      - name: resource_id
        in: query
        schema:
          type: string
      - name: last_event_id
        in: query
        schema:
          type: string
        description: For EventSource clients that cannot set the Last-Event-ID header.
      - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each frame's data field is a serialized Event.
              x-hs-sse-data-schema:
                $ref: '#/components/schemas/Event'
