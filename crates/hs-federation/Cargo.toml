[package]
name = "hs-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Federation and security: server discovery, key server, X-Matrix request signing/verification, the federation transport server and client, server ACLs (track 06)"

[dependencies]
axum.workspace = true
tokio.workspace = true
# The workspace's own `rustls-tls` feature (`Cargo.toml`) resolves to `rustls-tls-webpki-roots`
# only -- the ~140 public roots baked into the binary, never the OS trust store. Adding
# `rustls-tls-native-roots` here (this crate's own `Cargo.toml`, not the workspace root) unlocks
# `ClientBuilder::tls_built_in_native_certs`, which `client::client_for` uses to make
# `FederationConfig::trust_os_root_store` an operator-controlled *toggle* rather than an always-on
# default -- see that field's doc comment for why "off" is the right default. Purely additive:
# `rustls-native-certs` and its platform dependencies were already resolved in the workspace's
# `Cargo.lock` via another crate, so this adds no new crate to fetch.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
rand.workspace = true
futures.workspace = true
http.workspace = true
bytes.workspace = true
regex.workspace = true
async-trait.workspace = true
hickory-resolver.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
ruma.workspace = true
ipnet.workspace = true
hs-model = { path = "../hs-model" }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
hs-http = { path = "../hs-http" }
hs-config = { path = "../hs-config" }
# The admin API's federation source (`hs_admin::sources::FederationSource`) is implemented
# here over the destination store. No cycle: `hs-admin` depends on neither this crate nor
# anything that does.
hs-admin = { path = "../hs-admin" }
# Added by track 06 (fourth session): `hs_state::auth::{check_event_auth,
# check_auth_events_selection, expected_auth_types}` is the one real room-version auth-rules
# engine in the workspace, and `crate::join`/`crate::inbound` reuse it directly against a
# `StateFetch` built from `RoomDataSource`'s current-state read, rather than re-deriving the
# power-level/join-rule/membership rules a second time for inbound federation writes.
hs-state = { path = "../hs-state" }

[dev-dependencies]
hs-testkit = { path = "../hs-testkit" }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
rcgen.workspace = true
# For `client::tests`' in-process TLS test (no Docker needed): `rcgen` mints a self-signed
# certificate, `rustls`/`tokio-rustls`/`rustls-pki-types` terminate real TLS with it over a real
# loopback socket, and `hyper`/`hyper-util`/`http-body-util` speak one plain HTTP/1.1 response
# over the resulting stream -- proving `FederationConfig::custom_ca_certificates` actually changes
# what `reqwest` trusts, not just that the field exists. All five are already
# `[workspace.dependencies]` entries used elsewhere in the workspace.
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
