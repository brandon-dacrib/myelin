            $ref: '#/components/schemas/RoomEvent'
        state:
          type: array
          items:
            $ref: '#/components/schemas/StateEvent'
    RoomHierarchyNode:
      type: object
      required:
      - room_id
      - name
      - children
      - depth
      - known
      properties:
        room_id:
          type: string
        name:
          type:
          - string
          - 'null'
        topic:
          type:
          - string
          - 'null'
        canonical_alias:
          type:
          - string
          - 'null'
        room_type:
          type:
          - string
          - 'null'
          description: m.space for a space.
        join_rule:
          type:
          - string
          - 'null'
        joined_members_count:
          type:
          - integer
          - 'null'
        depth:
          type: integer
          description: How far below the requested room this node is (0 for the room itself).
        known:
