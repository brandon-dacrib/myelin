[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Axon: a modern Matrix homeserver in Rust"
rust-version = "1.91"
repository = ""
publish = false

# Shared dependency versions. Tracks add entries here only when missing, and record the addition in their status file.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
ruma = { version = "0.15", features = ["signatures", "state-res", "client-api", "federation-api", "appservice-api", "push-gateway-api", "identity-service-api", "rand", "unstable-msc4186"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
http = "1"
tower = "0.5"
rand = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
proptest = "1"
criterion = "0.5"
prometheus-client = "0.25"
serde_yaml_ng = "0.10"
schemars = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha1 = "0.10"
# Added by track 02 (state and model): rand_core 0.6, the version ed25519-dalek 2.x's optional
# `rand_core` feature pins, for `SigningKeyPair::generate`. `rand` (0.9) is unrelated and stays.
rand_core = "0.6"
# Added by track 01 (storage): embedded store, PostgreSQL client and pool, temp dirs for tests.
fjall = { version = "3", features = ["bytes_1"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tempfile = "3"
# Added by track 01 (storage), for the PostgreSQL `KvBackend`: `hs-kv`'s trait is synchronous
# (mirrors the embedded Fjall backend, which is also blocking), so the backend uses the
# synchronous `postgres` client (the same rust-postgres project as `tokio-postgres` above, with a
# small internal per-connection runtime hidden behind a blocking API) plus a synchronous `r2d2`
# pool, rather than bridging `tokio-postgres`/`deadpool-postgres` across an async/sync boundary
# inside every trait method. See `docs/status/01-storage-engine.md` for the rationale.
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
object_store = { version = "0.14", features = ["aws"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
http-body-util = "0.1"

# Added by track 03 (cluster): stable hashing for rendezvous and shard mapping, mesh TLS and HTTP/2 plumbing, constant-time compare, test certificates.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http2", "client"] }
subtle = "2"
rcgen = "0.14"

# Added by track 07 (auth and identity): native Argon2id password hashing, bcrypt verification
# for imported Synapse hashes, CRC32 for Synapse-shaped opaque token checksums, and regex for
# appservice namespace matching (the in-crate registry stub track 11 will replace).
argon2 = "0.5"
bcrypt = "0.17"
crc32fast = "1"
regex = "1"

# Added by track 15 (admin API and modules): ULIDs for server-generated identifiers (RFC 0004
# decision D15.2), RFC 3339 timestamp formatting for the admin API and audit log, the standard
# axum companion middleware (CORS, body-size limits, tracing) for hs-http, and embedding web/'s
# built assets at /admin/ (RFC 0004 section 13).
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "set-header"] }
rust-embed = { version = "8", features = ["mime-guess"] }
rustls-pemfile = "2"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Added by track 11 (appservices and bridges): Python-`re`-compatible regex (lookaround,
# backreferences) for appservice registration namespace patterns that the `regex` crate's
# linear-time engine cannot express (`PLAN.md` Appendix B); see
# `docs/status/11-appservices-and-bridges.md` for which patterns actually need it.
fancy-regex = "0.19"

# Added by track 09 (media): a tokio-based RFC 3507 ICAP/1.0 client/server library, adopted
# rather than hand-rolled per `docs/decisions/0007-build-less-reuse-more.md` after evaluating it
# against `docs/rfcs/0008-content-scanning.md` section 3.3 (see
# `docs/status/09-media.md`'s "Reuse considered" for the evaluation) — OPTIONS negotiation with an
# Options-TTL-aware cache, preview/100-continue, ISTag reconciliation, and Transfer-Preview/
# -Ignore/-Complete policy resolution all already implemented and unit-tested upstream.
icap-rs = "0.3"

# Added by track 12 (platform and Kubernetes): the `hs` CLI's subcommand parsing and its
# interactive/non-echoed password prompts (`hs register`, `hs hash-password`), and hs-operator's
# CRD schemas and reconcile loops.
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
kube = { version = "1", default-features = false, features = ["derive", "client", "runtime", "rustls-tls"] }
# Pinned to 0.25 (not 0.26) because kube-core 1.1.0 itself depends on `k8s-openapi = "0.25.0"`
# with no floating upper bound; a workspace pin of 0.26 resolves *both* versions into the
# dependency graph (one used by kube-core's own public types, one by anything depending on our
# pinned 0.26 directly), which fails to build (k8s-openapi's build script requires exactly one
# `v1_*` feature to be enabled, and Cargo unifies features per resolved version, not per crate).
# hs-operator's Cargo.toml has the matching note about `schemars` needing a separate 0.8 pin for
# the same reason (kube-core 1.1.0's `CustomResource` derive is still built against schemars 0.8,
# not the workspace's schemars "1").
k8s-openapi = { version = "0.25", features = ["latest", "schemars"] }

# Added by track 06 (federation and security): DNS resolution (A/AAAA/SRV) for server-name
# discovery (`docs/design/06-federation-threat-model.md` section 2.1), per the brief and decision
# 0007's reuse principle rather than a hand-rolled DNS client. `ipnet` is CIDR parsing/containment
# for `FederationConfig::ip_range_blocklist`/`ip_range_allowlist` enforcement in the federation
# client (threat model section 2.6); already pulled in transitively by `hickory-net`, promoted to
# a direct dependency rather than hand-rolling CIDR matching, per decision 0007.
hickory-resolver = { version = "0.26", features = ["tokio"] }
ipnet = "2"

# Added by track 05 (sync): `matrix-rust-sdk` as the real-client driver for `hs-loadgen`'s
# end-to-end scenario (named for this purpose in `docs/workstreams/14-test-and-conformance.md`).
# Default features off: `sqlite` (native sqlcipher bindings) pulls in build weight this scenario
# does not need (no persistent store -- an in-memory client is fine for a scripted one-shot run),
# so only a TLS backend is kept (the scenario talks to a local `http://` server, but `matrix-sdk`
# needs a backend selected to build its HTTP client at all). `e2e-encryption` (vodozemac) was added
# by track 08 for `hs-loadgen`'s encrypted scenario (in-memory crypto store; no `sqlite` needed).
matrix-sdk = { version = "0.19", default-features = false, features = ["rustls-aws-lc-rs", "e2e-encryption"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
lto = "thin"
codegen-units = 4
