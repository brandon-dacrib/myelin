{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hs.fullname" . }}
  labels:
    {{- include "hs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Client and federation traffic, and metrics scraping, from anywhere in the cluster by
    # default; tighten with a `from:` selector via extraConfig-style overrides if the deployment
    # needs a stricter mesh policy (cert-manager mTLS between replicas is out of scope for this
    # baseline policy — see docs/status/12-platform-and-kubernetes.md).
    - ports:
        - port: client
        - port: federation
        - port: metrics
    {{- if eq .Values.mode "cluster" }}
    # The mesh: only this release's own pods may forward to one another. Mutual TLS is the
    # real authentication (values.yaml, `cluster.mesh.tls`); this keeps the port off the
    # cluster network besides.
    - from:
        - podSelector:
            matchLabels:
              {{- include "hs.selectorLabels" . | nindent 14 }}
      ports:
        - port: mesh
    {{- end }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Outbound federation (any host, port 8448) and any other HTTPS dependency (OTLP, Sentry,
    # object storage, PostgreSQL) — left broad by default since none of those destinations are
    # knowable in a generic chart; a deployment-specific NetworkPolicy addition is expected for a
    # tighter egress policy.
    - {}
{{- end }}
