{{- if and .Values.podDisruptionBudget.enabled (eq .Values.mode "cluster") (gt (int (trim (include "hs.replicaCount" .))) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hs.fullname" . }}
  labels:
    {{- include "hs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hs.selectorLabels" . | nindent 6 }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
{{- end }}
