# `kubectl apply -k deploy/operator`: the operator in one namespace (set it here, or with
# `kustomize edit set namespace <ns>`). Apply the CRDs first, cluster-wide:
#
#   kubectl apply -f deploy/crds/homeserver.yaml -f deploy/crds/bridge.yaml
#
# (They are generated by `cargo run -p hs-operator --bin gen-crds`; kustomize will not load files
# from outside this directory, so they are not listed here.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myelin
resources:
  - operator.yaml
