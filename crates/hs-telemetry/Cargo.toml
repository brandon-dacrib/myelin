[package]
name = "hs-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tracing, structured logs, request ids, Prometheus metrics, health probes, OpenTelemetry and Sentry for the homeserver (track 12)"

[features]
default = []
# OpenTelemetry OTLP export of traces over gRPC, and W3C `traceparent` continuation. On in the
# shipped `hs` binary (hs-cli's default `otlp` feature); export still only happens when
# `telemetry.tracing.enabled` is set.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# `hs_telemetry::testing`: run code in a trace of its own and read back the spans it exported, for
# other crates' tests of their spans (a dev-dependency feature). It turns on `hyper-util`'s
# `tracing` feature, as `kube-client` does in the shipped binary and so in the workspace's test
# build: with it a new connection's task is spawned in the span current when it was opened, and
# a crate's own `cargo test -p` has to see that too, or a span test that passes there fails in
# the workspace gate (2026-10-14).
testing = ["otlp", "dep:hyper-util", "hyper-util/tracing"]
# Sentry error and panic reporting fed from `tracing` events.
sentry = ["dep:sentry"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std", "time"] }
tracing-log = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
pin-project-lite = "0.2"
prometheus-client = { workspace = true }
# `Metrics::begin_encode`: scrapes wait for the rendering in flight without holding a thread.
tokio = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros"] }

# Traces only: no metrics (Prometheus has those) and no log export (the pod's log has those).
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["grpc-tonic", "trace", "tls-ring", "tls-webpki-roots"] }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }
# Only for the `testing` feature's `tracing` flag on it (see there); already in every tree.
hyper-util = { workspace = true, optional = true }

sentry = { version = "0.49", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }

[package.metadata.docs.rs]
all-features = true
