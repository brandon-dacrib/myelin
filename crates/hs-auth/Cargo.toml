[package]
name = "hs-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Requester middleware, legacy login/UIA/registration, tokens, devices, password hashing and the native OAuth 2.0 issuer (design). Track 07: see docs/workstreams/07-auth-and-identity.md"

[dependencies]
hs-admin = { path = "../hs-admin" }
hs-compat = { path = "../hs-compat" }
hs-config = { path = "../hs-config" }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
bytes = { workspace = true }
time = { workspace = true }
ruma = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
argon2 = { workspace = true }
bcrypt = { workspace = true }
crc32fast = { workspace = true }
regex = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
http-body-util = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
