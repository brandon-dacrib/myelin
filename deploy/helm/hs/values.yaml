# Default values for the `hs` chart.
#
# Naming follows element-hq/ess-helm's `matrix-stack` chart conventions where a direct analog
# exists (refs/ess-helm/charts/matrix-stack/values.yaml: `image.{registry,repository,tag,digest,
# pullPolicy,pullSecrets}`, `postgres.{host,port,user,database,sslMode,password:{value|secret+
# secretKey}}`, `media.storage.{existingClaim,size,storageClassName}`,
# `ingress.{className,tlsEnabled,tlsSecret,annotations}`, `containersSecurityContext`,
# `storage.resourcePolicy`) so an operator who already runs ESS Community's Synapse component
# recognizes this chart's shape immediately, and so a future "swap the synapse: block for an hs:
# block in the umbrella chart" migration is a mostly mechanical value rename rather than a
# redesign. This chart is standalone (not a matrix-stack subchart) — see
# docs/status/12-platform-and-kubernetes.md for what remains to actually fold it into the
# umbrella chart.

## -- Deployment mode --------------------------------------------------------------------------
## `singleNode`: one replica, embedded (Fjall) storage on a PersistentVolumeClaim — the small-ARM-
##   host target (PLAN.md section 7.4). `storage.backend` is forced to `embedded` in this mode.
## `cluster`: `replicaCount` replicas, PostgreSQL-backed (via `postgres.*`, either CloudNativePG-
##   managed or an external database) or SlateDB-on-object-storage (`storage.backend: slatedb`).
mode: singleNode

## Number of replicas in `cluster` mode. Ignored (forced to 1) in `singleNode` mode.
replicaCount: 3

image:
  ## The host and (optional) port of the container image registry.
  registry: ghcr.io
  ## The path in the registry where the image lives.
  repository: brandon-dacrib/myelin
  ## One of `tag` or `digest` should be set; `tag` is used if both are.
  tag: ""
  # digest:
  ## Defaults to `IfNotPresent` when a digest is pinned, `Always` when a mutable tag is used,
  ## exactly like ESS's own image defaulting rule (refs/ess-helm/.../values.yaml `image.pullPolicy`).
  pullPolicy: ""
  pullSecrets: []

## The Matrix server name (`server.server_name` in the generated hs-config). Required.
serverName: ""

## The externally reachable base URL, if different from `https://{serverName}`.
publicBaseUrl: ""

## Extra native `hs-config` top-level sections, rendered as additional keys alongside the
## chart-generated `server`/`listeners`/`storage`/`telemetry` blocks in the ConfigMap. This is an
## append, not a deep merge — do not set `server`, `listeners`, `storage` or `telemetry` here (the
## chart already renders those from its own dedicated values and YAML does not define what a
## duplicate top-level key means); use it for the sections the chart has no dedicated values for:
## `federation`, `rate_limits`, `auth`, `appservices`, `cluster`. See crates/hs-config's rustdoc
## (`docs/config.md`, generated by `cargo run -p hs-config --bin gen_config_docs`) for the full
## schema.
extraConfig: {}

## Use an existing ConfigMap instead of the chart-rendered one. When set, `extraConfig` and every
## other config-shaping value below (storage, telemetry, etc.) is ignored; the referenced
## ConfigMap's `homeserver.yaml` key is mounted verbatim.
existingConfigMap: ""

storage:
  ## `embedded` (singleNode only), `postgres`, or `slatedb`.
  backend: embedded

  embedded:
    ## PersistentVolumeClaim for the embedded Fjall data directory.
    size: 10Gi
    storageClassName: ""
    existingClaim: ""
    ## Whether Helm keeps or deletes the constructed PVC on `helm uninstall` (mirrors ESS's
    ## top-level `storage.resourcePolicy`).
    resourcePolicy: keep

  ## PostgreSQL connection, for `storage.backend: postgres`. Leave `host` empty and set
  ## `cloudNativePG.enabled: true` below to have the chart provision the connection details from
  ## a CloudNativePG `Cluster` instead of filling them in by hand.
  postgres:
    host: ""
    port: 5432
    database: hs
    user: hs
    sslMode: prefer
    ## Either an inline value or a reference to an existing Secret key, exactly like
    ## ess-helm's `synapse.postgres.password` shape.
    password: {}
    # password:
    #   value: "..."
    # password:
    #   secret: existing-secret-name
    #   secretKey: password

  ## Object storage, for `storage.backend: slatedb` (and for the media repository's S3-compatible
  ## backend regardless of the primary storage backend — see `media.storage`).
  objectStorage:
    bucketUrl: ""
    shardCount: 256
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

## -- Media ------------------------------------------------------------------------------------
## Where uploaded and cached-remote media lives (`media.storage` in the generated hs-config).
media:
  storage:
    ## `local`: on a volume. In `singleNode` mode that is the embedded data volume, beside the
    ##   database, and there is nothing to set. In `cluster` mode replicas do not share a volume,
    ##   so `local` needs `local.existingClaim` to name a ReadWriteMany claim; without one the
    ##   chart refuses to render, because the alternative is an upload to one replica being a 404
    ##   on the others.
    ## `s3`: in a bucket, on any S3-compatible service. What `cluster` mode wants.
    backend: local
    local:
      existingClaim: ""
    s3:
      bucket: ""
      region: ""
      ## For S3-compatible services (MinIO, R2, Ceph RGW); leave empty for AWS.
      endpoint: ""
      accessKeyId: ""
      ## Secret holding the secret access key, mounted as a file (`secret_access_key_file`) so it
      ## is never in the ConfigMap.
      existingSecret: ""
      secretAccessKeyKey: secret-access-key

## CloudNativePG integration: when enabled, the chart points `storage.postgres` (and
## `storage.backend: postgres`, forced) at a CloudNativePG-managed `Cluster` rather than an
## externally managed database, matching CloudNativePG's own convention of a per-app `Cluster`
## plus a generated `-app` Secret holding `username`/`password`/`host`/`port`/`dbname`
## (https://cloudnative-pg.io/documentation/current/applications/). The chart does not create the
## `Cluster` resource itself (that is this deployment's database team's call — separate lifecycle,
## separate backup policy) — it only wires `envFrom`/connection details to an existing one.
cloudNativePG:
  enabled: false
  ## The CloudNativePG `Cluster` name; the chart reads connection details from
  ## `<clusterName>-app` (CloudNativePG's default naming for the application user Secret).
  clusterName: ""
  ## Override the generated Secret name if it does not follow the `<clusterName>-app` default.
  existingSecret: ""

secrets:
  ## `auth.registration_shared_secret` — required for `hs register` / the compat admin API.
  registrationSharedSecret:
    existingSecret: ""
    key: registration-shared-secret
  ## `auth.session_secret` — signs legacy session tokens.
  sessionSecret:
    existingSecret: ""
    key: session-secret
  ## The Ed25519 signing key (`hs generate-signing-key` format). Required; there is no generated
  ## default, since a signing key must be stable across restarts and (for federation) across the
  ## cluster. The whole Secret named by `existingSecret` is mounted as a directory at
  ## `server.signing_key_path` (`hs-cli` scans every file in that directory, Synapse-style, for
  ## the first parseable key) — `key` documents which data key inside that Secret should hold it
  ## (`kubectl create secret generic <name> --from-file=signing.key=<path>`); it is no longer
  ## used to `subPath`-mount a single file, since that silently defeated key persistence (see
  ## templates/configmap.yaml's comment on `signing_key_path`).
  signingKey:
    existingSecret: ""
    key: signing.key

telemetry:
  metrics:
    enabled: true
    synapseCompatNames: true
  logging:
    ## `json` (default, for log collectors) or `text` (Synapse-like, for a human tailing logs).
    format: json
    level: info
  tracing:
    enabled: false
    otlpEndpoint: ""
    sampleRatio: 0.1
  sentry:
    enabled: false
    dsn: {}
    # dsn:
    #   secret: existing-secret-name
    #   secretKey: dsn
    environment: production

service:
  type: ClusterIP
  clientPort: 8008
  federationPort: 8448
  metricsPort: 9090
  annotations: {}

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  ## Startup probe gives a slow first boot (large embedded-storage recovery, cold PostgreSQL
  ## connection pool) more time before liveness starts counting failures against it.
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
    # cpu intentionally has no default limit (CPU throttling under a hard limit hurts p99 latency
    # more than it helps; rely on requests + the HPA instead), matching ESS's own convention of
    # leaving cpu limits commented out by default.

## Pod-level security context. Matches PLAN.md section 7's non-root, read-only-root-filesystem
## requirement and deploy/Dockerfile's distroless/static-nonroot image (uid/gid 65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  annotations: {}

podDisruptionBudget:
  enabled: true
  ## Exactly one of minAvailable/maxUnavailable should be set. The default keeps at least one
  ## replica available in `cluster` mode; meaningless (and skipped by the template) at
  ## `replicaCount: 1` / `mode: singleNode`.
  minAvailable: 1
  # maxUnavailable:

## Pod anti-affinity so `cluster`-mode replicas are not scheduled onto the same node (a node loss
## should cost at most one replica, not enough to lose quorum on whatever consensus the storage
## backend layer needs). Disabled automatically in `singleNode` mode (nothing to spread).
affinity:
  podAntiAffinity:
    enabled: true
    ## `hard` (requiredDuringScheduling: replicas refuse to co-locate, can leave a replica
    ## Pending on a small cluster) or `soft` (preferredDuringScheduling: best-effort).
    style: soft
    topologyKey: kubernetes.io/hostname

tolerations: []
nodeSelector: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  ## Standard resource-based targets, evaluated by the metrics-server (no extra dependency).
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80
  ## Custom metrics (require the Prometheus Adapter or KEDA's Prometheus scaler reading the
  ## `hs_*` metrics this chart's ServiceMonitor scrapes — see docs/decisions/0004-telemetry-conventions.md
  ## for the metric names). Left empty by default since it requires cluster operator setup this
  ## chart cannot assume is present; documented here as the intended shape.
  customMetrics: []
  # customMetrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: hs_http_requests_total
  #       target:
  #         type: AverageValue
  #         averageValue: "1000"

ingress:
  enabled: false
  className: ""
  annotations: {}
  tlsEnabled: true
  tlsSecret: ""
  ## Hosts routed to the client (`/_matrix/client`) and federation (`/_matrix/federation`,
  ## `/_matrix/key`) resources. Usually the same host as `serverName`, split out here because
  ## federation delegation (`.well-known/matrix/server`) commonly points federation traffic at a
  ## different `host:port` than the client-facing one.
  clientHost: ""
  federationHost: ""

## Gateway API routing (HTTPRoute), as an alternative to `ingress.*`. Mutually exclusive in
## practice (enable one or the other); the chart does not enforce that, it just renders both if
## both are enabled.
gatewayApi:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  clientHostnames: []
  federationHostnames: []

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

networkPolicy:
  enabled: false

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

## Whether to instruct Helm to keep or delete all constructed PersistentVolumeClaims by default
## when uninstalling the chart (top-level, mirrors ESS; `storage.embedded.resourcePolicy`
## overrides this for the embedded-storage PVC specifically if both are set).
storagePolicy:
  resourcePolicy: keep
