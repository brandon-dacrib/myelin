{{- $backend := include "hs.storageBackend" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hs.fullname" . }}
  labels:
    {{- include "hs.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "hs.fullname" . }}-headless
  replicas: {{ include "hs.replicaCount" . }}
  selector:
    matchLabels:
      {{- include "hs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hs.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (eq .Values.mode "cluster") .Values.affinity.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.affinity.podAntiAffinity.style "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "hs.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.affinity.podAntiAffinity.topologyKey }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "hs.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.affinity.podAntiAffinity.topologyKey }}
          {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.mode "cluster" }}
      ## The server hands its shards to its peers before its listeners stop (up to twenty
      ## seconds, crates/hs-cli/src/serve.rs CLUSTER_DRAIN_DEADLINE); this must outlast that.
      terminationGracePeriodSeconds: {{ .Values.cluster.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: hs
          image: {{ include "hs.image" . }}
          imagePullPolicy: {{ include "hs.imagePullPolicy" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if eq $backend "embedded" }}
          ## `--data-dir`: database, signing keys and media under the data volume, the layout the
          ## image's own `docker run` quickstart uses. The ConfigMap is the seed layer on top.
          args: ["serve", "--data-dir", {{ include "hs.dataDir" . | quote }}, "-c", "/etc/hs/config/homeserver.yaml"]
          {{- else }}
          args: ["serve", "-c", "/etc/hs/config/homeserver.yaml"]
          {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.service.clientPort }}
              protocol: TCP
            - name: federation
              containerPort: {{ .Values.service.federationPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            {{- if eq .Values.mode "cluster" }}
            - name: mesh
              containerPort: {{ .Values.cluster.mesh.port }}
              protocol: TCP
            {{- end }}
          env:
            ## No RUST_LOG here: `telemetry.logging.level` in the ConfigMap sets the level, and
            ## the server's own directives for it hold the embedded storage engine to `warn`
            ## (crates/hs-telemetry/src/init.rs). A `RUST_LOG=info` in the environment overrode
            ## that and put sixty `lsm_tree` lines above the setup link on every first boot
            ## (seen 2026-09-26). Set RUST_LOG through `extraEnv` to debug something specific.
            ## Pinned through the environment rather than written to the ConfigMap: the
            ## environment outranks the database (docs/rfcs/0016), so these always mean what the
            ## chart says, `helm upgrade` after `helm upgrade`, and the admin interface shows
            ## them as set by the deployment rather than offering to change them.
            - name: HS__SERVER__SERVER_NAME
              value: {{ .Values.serverName | quote }}
            {{- if .Values.publicBaseUrl }}
            - name: HS__SERVER__PUBLIC_BASEURL
              value: {{ .Values.publicBaseUrl | quote }}
            {{- end }}
            {{- if .Values.secrets.signingKey.existingSecret }}
            ## A *directory*, not a file: the loader (crates/hs-cli/src/identity.rs) reads every
            ## regular file in it, Synapse-style, for the first parseable key. Pointing it at a
            ## `subPath`-mounted file made `read_dir` fail silently and gave every restart a
            ## fresh key (2026-09-19); the Secret is mounted whole, below.
            - name: HS__SERVER__SIGNING_KEY_PATH
              value: /etc/hs/secrets/signing-key
            {{- end }}
            {{- if eq $backend "postgres" }}
            {{- if .Values.cloudNativePG.enabled }}
            - name: HS__STORAGE__BACKEND
              value: postgres
            - name: HS__STORAGE__HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudNativePG.existingSecret | default (printf "%s-app" .Values.cloudNativePG.clusterName) }}
                  key: host
            - name: HS__STORAGE__PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudNativePG.existingSecret | default (printf "%s-app" .Values.cloudNativePG.clusterName) }}
                  key: port
            - name: HS__STORAGE__DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudNativePG.existingSecret | default (printf "%s-app" .Values.cloudNativePG.clusterName) }}
                  key: dbname
            - name: HS__STORAGE__USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudNativePG.existingSecret | default (printf "%s-app" .Values.cloudNativePG.clusterName) }}
                  key: user
            - name: HS__STORAGE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudNativePG.existingSecret | default (printf "%s-app" .Values.cloudNativePG.clusterName) }}
                  key: password
            {{- else if .Values.storage.postgres.password.secret }}
            - name: HS__STORAGE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.postgres.password.secret }}
                  key: {{ .Values.storage.postgres.password.secretKey | default "password" }}
            {{- else if .Values.storage.postgres.password.value }}
            - name: HS__STORAGE__PASSWORD
              value: {{ .Values.storage.postgres.password.value | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $backend "embedded" }}
            ## The same directory `--data-dir` names above, so `kubectl exec <pod> -- hs recover`
            ## finds the signing key with no flags (see NOTES.txt, "Locked out").
            - name: HS_DATA_DIR
              value: {{ include "hs.dataDir" . | quote }}
            {{- end }}
            {{- if eq .Values.mode "cluster" }}
            ## Cluster mode, pinned through the environment so it holds on every pod whatever
            ## the admin interface stores (a replica that fell back to single_node: true would
            ## own every room itself and fork them). The pod's mesh address is its own stable
            ## DNS name under the headless Service, composed from the Downward API: peers dial
            ## it and verify this pod's certificate against it, which is why it is a name and
            ## not status.podIP (see values.yaml, `cluster`).
            - name: HS__CLUSTER__SINGLE_NODE
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HS__CLUSTER__MESH__ADVERTISE_ADDRESS
              value: {{ printf "$(POD_NAME).%s" (include "hs.meshDomain" .) | quote }}
            - name: HS__CLUSTER__MESH__PORT
              value: {{ .Values.cluster.mesh.port | quote }}
            {{- if .Values.cluster.mesh.tls.existingSecret }}
            - name: HS__CLUSTER__MESH__TLS__CERTIFICATE_PATH
              value: /etc/hs/secrets/mesh-tls/tls.crt
            - name: HS__CLUSTER__MESH__TLS__PRIVATE_KEY_PATH
              value: /etc/hs/secrets/mesh-tls/tls.key
            - name: HS__CLUSTER__MESH__TLS__CA_CERTIFICATE_PATH
              value: /etc/hs/secrets/mesh-tls/ca.crt
            - name: HS__CLUSTER__MESH__TLS__PEER_SAN_SUFFIX
              value: {{ printf ".%s" (include "hs.meshDomain" .) | quote }}
            {{- else }}
            - name: HS__CLUSTER__MESH__SHARED_SECRET_FILE
              value: /etc/hs/secrets/mesh-shared-secret
            {{- end }}
            {{- end }}
            {{- if .Values.secrets.registrationSharedSecret.existingSecret }}
            - name: HS__AUTH__REGISTRATION_SHARED_SECRET_FILE
              value: /etc/hs/secrets/registration-shared-secret
            {{- end }}
            {{- if .Values.secrets.sessionSecret.existingSecret }}
            - name: HS__AUTH__SESSION_SECRET_FILE
              value: /etc/hs/secrets/session-secret
            {{- end }}
            {{- if and .Values.telemetry.sentry.enabled .Values.telemetry.sentry.dsn.secret }}
            - name: HS__TELEMETRY__SENTRY__DSN_FILE
              value: /etc/hs/secrets/sentry-dsn
            {{- end }}
            {{- if .Values.bridges.enabled }}
            ## The server deploys bridges (docs/rfcs/0017, 4.5): with both set it writes `Bridge`
            ## resources into this namespace with its service account's token (bridges-rbac.yaml
            ## allows it), and each bridge reaches the server at the in-cluster URL.
            - name: MYELIN_BRIDGES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MYELIN_BRIDGES_HOMESERVER_URL
              value: {{ printf "http://%s.%s.svc:%v" (include "hs.fullname" .) .Release.Namespace .Values.service.clientPort | quote }}
            {{- if .Values.bridges.offerings }}
            ## The offerings the deployment declares (values.yaml `bridges.offerings`): created
            ## once, then the admin interface's.
            - name: MYELIN_BRIDGES_OFFERINGS
              value: {{ toJson .Values.bridges.offerings | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/hs/config
              readOnly: true
            {{- if .Values.secrets.signingKey.existingSecret }}
            ## Mounted as a directory (no `subPath`); see HS__SERVER__SIGNING_KEY_PATH above.
            - name: secrets-signing-key
              mountPath: /etc/hs/secrets/signing-key
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.registrationSharedSecret.existingSecret }}
            - name: secrets-registration-shared-secret
              mountPath: /etc/hs/secrets/registration-shared-secret
              subPath: {{ .Values.secrets.registrationSharedSecret.key }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.mode "cluster" }}
            {{- if .Values.cluster.mesh.tls.existingSecret }}
            ## Mounted whole: tls.crt, tls.key and ca.crt, the kubernetes.io/tls layout.
            - name: secrets-mesh-tls
              mountPath: /etc/hs/secrets/mesh-tls
              readOnly: true
            {{- else }}
            - name: secrets-mesh-shared-secret
              mountPath: /etc/hs/secrets/mesh-shared-secret
              subPath: {{ .Values.cluster.mesh.sharedSecret.key }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.secrets.sessionSecret.existingSecret }}
            - name: secrets-session-secret
              mountPath: /etc/hs/secrets/session-secret
              subPath: {{ .Values.secrets.sessionSecret.key }}
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.sentry.enabled .Values.telemetry.sentry.dsn.secret }}
            - name: secrets-sentry-dsn
              mountPath: /etc/hs/secrets/sentry-dsn
              subPath: {{ .Values.telemetry.sentry.dsn.secretKey | default "dsn" }}
              readOnly: true
            {{- end }}
            {{- if eq $backend "embedded" }}
            - name: data
              mountPath: {{ include "hs.dataDir" . }}
            {{- end }}
            {{- if and (eq .Values.media.storage.backend "local") .Values.media.storage.local.existingClaim }}
            - name: media
              mountPath: /var/lib/hs/media
            {{- end }}
            {{- if and (eq .Values.media.storage.backend "s3") .Values.media.storage.s3.existingSecret }}
            - name: secrets-media-s3
              mountPath: /etc/hs/secrets/media-s3
              readOnly: true
            {{- end }}
            ## `containerSecurityContext.readOnlyRootFilesystem: true` needs a writable /tmp;
            ## nothing else on this image writes outside the mounts above.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: client
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: client
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: client
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.existingConfigMap | default (printf "%s-config" (include "hs.fullname" .)) }}
        {{- if .Values.secrets.signingKey.existingSecret }}
        - name: secrets-signing-key
          secret:
            secretName: {{ .Values.secrets.signingKey.existingSecret }}
        {{- end }}
        {{- if .Values.secrets.registrationSharedSecret.existingSecret }}
        - name: secrets-registration-shared-secret
          secret:
            secretName: {{ .Values.secrets.registrationSharedSecret.existingSecret }}
        {{- end }}
        {{- if eq .Values.mode "cluster" }}
        {{- if .Values.cluster.mesh.tls.existingSecret }}
        - name: secrets-mesh-tls
          secret:
            secretName: {{ .Values.cluster.mesh.tls.existingSecret }}
        {{- else }}
        - name: secrets-mesh-shared-secret
          secret:
            secretName: {{ .Values.cluster.mesh.sharedSecret.existingSecret }}
        {{- end }}
        {{- end }}
        {{- if .Values.secrets.sessionSecret.existingSecret }}
        - name: secrets-session-secret
          secret:
            secretName: {{ .Values.secrets.sessionSecret.existingSecret }}
        {{- end }}
        {{- if and .Values.telemetry.sentry.enabled .Values.telemetry.sentry.dsn.secret }}
        - name: secrets-sentry-dsn
          secret:
            secretName: {{ .Values.telemetry.sentry.dsn.secret }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if and (eq .Values.media.storage.backend "local") .Values.media.storage.local.existingClaim }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.media.storage.local.existingClaim }}
        {{- end }}
        {{- if and (eq .Values.media.storage.backend "s3") .Values.media.storage.s3.existingSecret }}
        - name: secrets-media-s3
          secret:
            secretName: {{ .Values.media.storage.s3.existingSecret }}
        {{- end }}
        {{- if and (eq $backend "embedded") .Values.storage.embedded.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.embedded.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if and (eq $backend "embedded") (not .Values.storage.embedded.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        ## Selector labels only, on purpose. Everything in a StatefulSet's spec outside
        ## replicas, template, updateStrategy and a few others is immutable once created, and
        ## that includes these labels. The standard label set carries the chart version and the
        ## appVersion, both of which change with every published chart (the appVersion is the
        ## commit), so with them here every `helm upgrade` to a newer chart was refused
        ## ("Forbidden: updates to statefulset spec for fields other than ..."). Name and
        ## instance never change. An install made before this fix has the old labels baked in:
        ## `kubectl delete statefulset <name> --cascade=orphan` (pod and claim stay), then upgrade.
        labels:
          {{- include "hs.selectorLabels" . | nindent 10 }}
        {{- if eq (.Values.storage.embedded.resourcePolicy | default .Values.storagePolicy.resourcePolicy) "keep" }}
        annotations:
          helm.sh/resource-policy: keep
        {{- end }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.embedded.storageClassName }}
        storageClassName: {{ .Values.storage.embedded.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.embedded.size }}
  {{- end }}
