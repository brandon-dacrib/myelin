        reason:
          type:
          - string
          - 'null'
          description: Why deployment is unavailable, when it is.
    BridgeOfferingAccess:
      type: object
      properties:
        all_local_users:
          type: boolean
          description: Every local user may have an instance.
        users:
          type: array
          items:
            type: string
