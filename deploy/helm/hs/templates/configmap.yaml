{{- include "hs.validate" . -}}
{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hs.fullname" . }}-config
  labels:
    {{- include "hs.labels" . | nindent 4 }}
data:
  # The *file* layer of the server's configuration (docs/rfcs/0016): it seeds the database on
  # the first start and is outranked by the database after that, so what is here is what an
  # operator may later change in the admin interface. What must always apply -- the server name,
  # the public base URL, the signing-key path, the database connection -- is not here: the
  # StatefulSet passes those as `HS__` environment variables, which outrank everything.
  homeserver.yaml: |
    {{- $backend := include "hs.storageBackend" . }}
    listeners:
      listeners:
        - port: {{ .Values.service.clientPort }}
          bind_addresses: ["::"]
          resources: [client, federation, health]
        - port: {{ .Values.service.metricsPort }}
          bind_addresses: ["::"]
          resources: [metrics]
    {{- if ne $backend "embedded" }}
    storage:
      backend: {{ $backend }}
      {{- if eq $backend "postgres" }}
      {{- if .Values.cloudNativePG.enabled }}
      # host/port/database/user/password are supplied via HS__STORAGE__* environment variables
      # sourced from the CloudNativePG-generated Secret (see templates/deployment.yaml /
      # statefulset.yaml's envFrom); nothing to render inline here.
      host: PLACEHOLDER_SET_VIA_HS__STORAGE__HOST_ENV
      database: PLACEHOLDER_SET_VIA_HS__STORAGE__DATABASE_ENV
      user: PLACEHOLDER_SET_VIA_HS__STORAGE__USER_ENV
      {{- else }}
      host: {{ .Values.storage.postgres.host | quote }}
      port: {{ .Values.storage.postgres.port }}
      database: {{ .Values.storage.postgres.database | quote }}
      user: {{ .Values.storage.postgres.user | quote }}
      {{- end }}
      {{- else if eq $backend "slatedb" }}
      bucket_url: {{ .Values.storage.objectStorage.bucketUrl | quote }}
      shard_count: {{ .Values.storage.objectStorage.shardCount }}
      {{- end }}
    {{- end }}
    {{- /*
    Embedded storage says nothing here: `hs serve --data-dir` (see statefulset.yaml's args)
    derives `db/`, `keys/` and `media/` under the data volume, and a path written here would
    outrank that derivation for no gain. Media is rendered only when it is somewhere other than
    the data volume: an S3 bucket, or a dedicated claim. Left unset in *that* case,
    `media.storage.path` would default to the relative `./media-store` -- the container's working
    directory, on no volume and not writable under `readOnlyRootFilesystem: true`.
    */}}
    {{- if or (eq .Values.media.storage.backend "s3") .Values.media.storage.local.existingClaim (ne $backend "embedded") }}
    media:
      storage:
        {{- if eq .Values.media.storage.backend "s3" }}
        backend: s3
        bucket: {{ .Values.media.storage.s3.bucket | quote }}
        {{- with .Values.media.storage.s3.region }}
        region: {{ . | quote }}
        {{- end }}
        {{- with .Values.media.storage.s3.endpoint }}
        endpoint: {{ . | quote }}
        {{- end }}
        {{- with .Values.media.storage.s3.accessKeyId }}
        access_key_id: {{ . | quote }}
        {{- end }}
        {{- if .Values.media.storage.s3.existingSecret }}
        secret_access_key_file: /etc/hs/secrets/media-s3/{{ .Values.media.storage.s3.secretAccessKeyKey }}
        {{- end }}
        {{- else }}
        backend: local
        path: {{ include "hs.mediaPath" . }}
        {{- end }}
    {{- end }}
    telemetry:
      metrics:
        enabled: {{ .Values.telemetry.metrics.enabled }}
        synapse_compat_names: {{ .Values.telemetry.metrics.synapseCompatNames }}
      logging:
        level: {{ .Values.telemetry.logging.level }}
        json: {{ eq .Values.telemetry.logging.format "json" }}
      tracing:
        enabled: {{ .Values.telemetry.tracing.enabled }}
        {{- if .Values.telemetry.tracing.otlpEndpoint }}
        otlp_endpoint: {{ .Values.telemetry.tracing.otlpEndpoint | quote }}
        {{- end }}
        sample_ratio: {{ .Values.telemetry.tracing.sampleRatio }}
      {{- if .Values.telemetry.sentry.enabled }}
      sentry:
        environment: {{ .Values.telemetry.sentry.environment | quote }}
      {{- end }}
    {{- if .Values.extraConfig }}
    {{- toYaml .Values.extraConfig | nindent 4 }}
    {{- end }}
{{- end }}
