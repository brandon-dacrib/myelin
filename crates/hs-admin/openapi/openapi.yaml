# This is the OpenAPI 3.1 contract for RFC 0004 (docs/rfcs/0004-admin-api.md), the admin API
# under /api/v1. It was produced by a throwaway Python generator script (not checked into this
# repository; see docs/status/15-admin-api-and-modules.md, "Decisions made") to keep ~120 paths'
# pagination envelopes, error responses and scopes consistent. From here on, hand-edit this file
# (and its companion crates/hs-admin/openapi/operations.json, the Rust-consumable operation table
# `hs-admin`'s router is built from) directly; keep the two in sync by hand, since the generator
# no longer exists. `cargo test -p hs-admin --test contract` and `npx @redocly/cli lint` catch
# drift between this file, operations.json, and the router.
openapi: 3.1.0
info:
  title: hs-admin API
  summary: The native administration and moderation API for the homeserver.
  version: 0.1.0
  description: 'The only API the management interface (track 16) talks to. See docs/rfcs/0004-admin-api.md for the full design rationale: resource modeling, naming, pagination, filtering, errors, idempotency, scopes, versioning and the event stream. This document is the contract; the hs-admin router''s contract tests assert the router and this document agree on paths and methods (RFC 0004 section 1, decision D15.16).'
  contact:
    name: 'Track 15: Admin API and modules'
    url: https://github.com/example/matrix-reimplement/blob/main/docs/workstreams/15-admin-api-and-modules.md
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-hs-contract: 1.0-draft
  x-hs-changelog:
  - version: 0.1.0
    date: '2026-09-18'
    notes: Initial draft covering every resource in RFC 0004 section 4. Not yet frozen; freezes at week 8 as contract 1.0.
servers:
- url: /api/v1
  description: Same origin as /_matrix on the client listener.
tags:
- name: Server
  description: Server identity, health and the caller's own principal.
- name: Setup
  description: Creating the first administrator on a server that has none.
- name: Recovery
  description: Getting an administrator back into a server nobody can sign in to, with a link issued to whoever holds the server's signing key.
- name: Users
  description: Users, devices, sessions and their moderation actions.
- name: Rooms
  description: Rooms, their state, timeline and moderation actions.
- name: Media
  description: Media metadata, quarantine and bulk cleanup.
- name: Federation
  description: Federation destinations and signing keys.
- name: Reports
  description: Event and user reports (one inbox, kind discriminated).
- name: RegistrationTokens
  description: Registration token management.
- name: Tasks
  description: Long-running operations.
- name: Statistics
  description: Dashboard and time-series statistics.
- name: ServerNotices
  description: Sending and listing server notices.
- name: Bridges
  description: Appservices (11's registry) and the bridge-type catalog.
- name: Cluster
  description: Cluster (03) replica and shard status.
- name: Migration
  description: Migration from Synapse (13).
- name: Config
  description: Reloadable configuration (13).
- name: AuditLog
  description: The immutable audit log.
- name: Events
  description: The server-sent-events stream.
security:
- OAuth2: []
paths:
  /appservices:
    get:
      summary: List appservices
      operationId: appservices.list
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: A page of appservices, with health summaries inline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServicePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      summary: Create (register) an appservice
      operationId: appservices.create
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - name: dry_run
        in: query
        schema:
          type: boolean
          default: false
        description: Validate and return the parsed registration and namespace conflicts without creating anything.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppServiceCreate'
      responses:
        '201':
          description: The created appservice; live immediately (hot registration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /appservices/{id}:
    get:
      summary: Get an appservice
      operationId: appservices.get
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '200':
          description: The appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      summary: Update an appservice
      operationId: appservices.update
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppServiceUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      summary: Remove an appservice
      operationId: appservices.delete
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/backlog:
    get:
      summary: List pending and dead-lettered transactions
      operationId: appservices.backlog
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      responses:
        '200':
          description: A page of backlog entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServiceBacklogEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidCursor'
  /appservices/{id}/health:
    get:
      summary: Get an appservice's health
      operationId: appservices.health
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '200':
          description: Health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServiceHealth'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/pause:
    post:
      summary: Pause an appservice
      operationId: appservices.pause
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The updated appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/ping:
    post:
      summary: Ping an appservice
      operationId: appservices.ping
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The updated appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/registration:
    get:
      summary: Export an appservice's registration (includes tokens)
      operationId: appservices.registration
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '200':
          description: The registration.
          content:
            application/json:
              schema:
                type: object
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/replay:
    post:
      summary: Replay pending or dead-lettered transactions (Task)
      operationId: appservices.replay
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppServiceReplayRequest'
      responses:
        '202':
          description: Accepted; a Task tracks progress.
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/tasks/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /appservices/{id}/resume:
    post:
      summary: Resume a paused appservice
      operationId: appservices.resume
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The updated appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/rotate-tokens:
    post:
      summary: Rotate an appservice's tokens
      operationId: appservices.rotate_tokens
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new tokens, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServiceTokens'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /audit-log:
    get:
      summary: List audit entries
      operationId: audit_log.list
      tags:
      - AuditLog
      security:
      - OAuth2:
        - admin:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      - name: actor
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: target_type
        in: query
        schema:
          type: string
      - name: target_id
        in: query
        schema:
          type: string
      - name: outcome
        in: query
        schema:
          type: string
          enum:
          - success
          - failure
      - name: recorded_after
        in: query
        schema:
          type: string
          format: date-time
      - name: recorded_before
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /audit-log/export:
    get:
      summary: Export the audit log as NDJSON
      operationId: audit_log.export
      tags:
      - AuditLog
      security:
      - OAuth2:
        - admin:read
      parameters:
      - name: recorded_after
        in: query
        schema:
          type: string
          format: date-time
      - name: recorded_before
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: NDJSON stream, one AuditEntry per line.
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /audit-log/{id}:
    get:
      summary: Get an audit entry
      operationId: audit_log.get
      tags:
      - AuditLog
      security:
      - OAuth2:
        - admin:read
      parameters:
      - $ref: '#/components/parameters/AuditEntryId'
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /bridge-deployment-target:
    get:
      summary: Whether this server can deploy bridges
      description: Available when the server runs in Kubernetes with the chart's bridges enabled (RFC 0017); `namespace` is where bridge instances run and `homeserver_url` is how they reach this server.
      operationId: bridge_deployments.target
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      responses:
        '200':
          description: The deployment target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeDeploymentTarget'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /bridge-offerings:
    get:
      summary: List bridge offerings
      description: The bridge types switched on for this server (RFC 0017), each with its instance counts.
      operationId: bridge_offerings.list
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      responses:
        '200':
          description: Offerings, as one page (there is no cursor to follow; an offering is one per catalogue type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeOfferingPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /bridge-offerings/{type}:
    get:
      summary: Get a bridge offering
      operationId: bridge_offerings.get
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/BridgeTypeId'
      responses:
        '200':
          description: The offering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeOffering'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      summary: Offer a bridge on this server, or change the offering
      description: 'Creates or replaces the offering. Registers its front door (`@<bot>:server`), which users message to get their own instance. For a `shared` type, also creates its one instance. 400 for `runtime: cluster` when this server cannot deploy, or for a type that cannot run from a rendered config alone.'
      operationId: bridge_offerings.put
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/BridgeTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeOfferingRequest'
      responses:
        '200':
          description: The offering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeOffering'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      summary: Stop offering a bridge
      description: Removes the offering and its front door. 409 while it has instances, unless `remove_instances=true`, which removes every instance (their pods, volumes and everyone's sign-ins) first.
      operationId: bridge_offerings.delete
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/BridgeTypeId'
      - $ref: '#/components/parameters/RemoveInstances'
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
