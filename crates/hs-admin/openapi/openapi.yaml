          description: Not recorded for aliases made before it was; null then.
        creator:
          type:
          - string
          - 'null'
          description: Who made the alias, when that is known.
        canonical:
          type: boolean
          description: Whether the room's m.room.canonical_alias names it.
    ForwardExtremity:
      type: object
      required:
      - event_id
      - type
      - sender
      - depth
      - origin_server_ts
      properties:
        event_id:
          type: string
        type:
          type: string
        sender:
          type: string
        depth:
          type: integer
        origin_server_ts:
          type: integer
        state_key:
          type:
          - string
          - 'null'
    ForwardExtremitiesPruned:
      type: object
      required:
      - deleted
      - remaining
      properties:
        deleted:
          type: array
          description: The event ids that are no longer forward extremities.
          items:
            type: string
        remaining:
          type: array
          items:
            $ref: '#/components/schemas/ForwardExtremity'
    MediaItem:
      type: object
      required:
      - server_name
      - media_id
      - origin
      - uploader
      - upload_name
      - content_type
      - size_bytes
      - created_at
      - last_accessed_at
      - quarantined
      - protected
      properties:
        server_name:
          type: string
        media_id:
          type: string
        origin:
          type: string
          enum:
          - local
          - remote
        uploader:
          type:
          - string
          - 'null'
        upload_name:
          type:
          - string
          - 'null'
        content_type:
          type:
          - string
          - 'null'
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        last_accessed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the content was last served (download or thumbnail), at an hour's resolution; null if it never has been. The bulk deletions count "unused since" from this, or from created_at when it is null.
        quarantined:
          type: boolean
        protected:
          type: boolean
          description: Exempt from quarantine and from the bulk deletions. Protection and quarantine exclude each other; setting one while the other is set answers 409.
    Destination:
      type: object
      properties:
        server_name:
          type: string
        last_successful_at:
          type:
          - string
          - 'null'
          format: date-time
        failing_since:
          type:
          - string
          - 'null'
          format: date-time
        retry_last_at:
          type:
          - string
          - 'null'
          format: date-time
        retry_interval_ms:
          type:
          - integer
          - 'null'
        pending_pdu_count:
          type: integer
        pending_edu_count:
          type: integer
        catch_up_since:
          type:
          - string
          - 'null'
          format: date-time
          description: When the destination's outbound queue overflowed (or catch-up was otherwise asked for) and it went into catch-up mode; null when it is not catching up. While set, nothing more is queued for it, and once it answers it is sent the latest event of each room it is behind in.
        shared_rooms_count:
          type:
          - integer
          - 'null'
          description: How many rooms this server shares with the destination (rooms where both
            have a joined member); null when the server cannot say. A destination sharing none
            is state, not a relationship, and may be forgotten (decision 0042).
    DestinationForgotten:
      type: object
      description: What forgetting a destination dropped (`federation.destinations.forget`).
      required:
      - server_name
      - dropped_pdu_count
      - dropped_edu_count
      - dropped_key_count
      - was_catching_up
      - shared_rooms_count
      properties:
        server_name:
          type: string
        dropped_pdu_count:
          type: integer
          description: Room events that were queued for it and are now gone, unsent.
        dropped_edu_count:
          type: integer
          description: To-device messages and device-list updates that were queued for it and
            are now gone.
        dropped_key_count:
          type: integer
          description: Signing keys of it this server held and no longer does.
        was_catching_up:
          type: boolean
        shared_rooms_count:
          type: integer
          description: How many rooms this server shared with it when it was forgotten
            (non-zero only with `force=true`).
    DestinationPruneRequest:
      type: object
      description: What `federation.destinations.prune` is asked; every field is optional.
      properties:
        failing_for:
          type: string
          description: 'A duration (`7d`, `12h`, `30m`, `0s`): also forget every destination
            failing for at least this long whose queued events are only for rooms this server
            has since left. Absent, destinations with a queue are kept.'
    DestinationPruneReport:
      type: object
      description: What `federation.destinations.prune` forgot (or would) and kept, and why.
      required:
      - dry_run
      - forgotten
      - kept
      properties:
        dry_run:
          type: boolean
          description: Whether nothing was forgotten (a dry run).
        forgotten:
          $ref: '#/components/schemas/DestinationPruneGroup'
        kept:
          $ref: '#/components/schemas/DestinationPruneGroup'
    DestinationPruneGroup:
      type: object
      description: One side of a prune report.
      required:
      - count
      - by_reason
      - servers
      properties:
        count:
          type: integer
          description: How many in all.
        by_reason:
          type: object
          additionalProperties:
            type: integer
          description: 'How many for each reason. Forgotten: `unused` (shares no room, nothing
            queued), `failing` (failing long enough, queue only for rooms this server left).
            Kept: `shares_rooms`, `queued_for_current_rooms`, `queued_not_failing`,
            `failing_recently`, `active_recently`.'
        servers:
          type: array
          description: The first 50, by name; `count` is the whole list's.
          items:
            $ref: '#/components/schemas/DestinationPruneEntry'
    DestinationPruneEntry:
      type: object
      required:
      - server_name
      - reason
      - detail
      properties:
        server_name:
          type: string
        reason:
          type: string
          description: One of the reasons `by_reason` is keyed by.
        detail:
          type: string
          description: One sentence with the numbers behind the reason.
    DestinationRoom:
      type: object
      description: One room this server shares with a destination (at least one of its users is joined).
      required:
      - room_id
      - joined_members_count
      - destination_members_count
      properties:
        room_id:
          type: string
        name:
          type:
          - string
          - 'null'
        canonical_alias:
          type:
          - string
          - 'null'
        joined_members_count:
          type: integer
          description: Everyone joined to the room, from every server.
        destination_members_count:
          type: integer
          description: How many of the joined members are the destination's users.
    ServerSigningKey:
      type: object
      required:
      - key_id
      - algorithm
      - public_key
      - old
      properties:
        key_id:
          type: string
          description: ed25519:<version>.
        algorithm:
          type: string
        public_key:
          type: string
          description: Base64 (standard alphabet, unpadded), as published.
        valid_until_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Until when the key may be used (a cached current key's valid_until_ts, an old key's expired_ts); null for this server's own keys, which are valid until rotated.
        old:
          type: boolean
          description: An old key (old_verify_keys), usable only for what was signed before valid_until_at.
    RemoteServerKeys:
      type: object
      description: What this server's key cache holds for another server.
      required:
      - server_name
      - keys
      properties:
        server_name:
          type: string
        keys:
          type: array
          description: Current keys first, then old ones.
          items:
            $ref: '#/components/schemas/ServerSigningKey'
        cached_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a key response from (or about) the server was last accepted.
    Report:
      type: object
      description: A report filed through the client-server API (POST /rooms/{roomId}/report/{eventId}, POST /rooms/{roomId}/report, POST /users/{userId}/report). Resolving with no_action dismisses it; any other resolution resolves it. Either closes it for good.
      required:
      - id
      - kind
      - status
      - reporter_id
      - received_at
      properties:
        id:
          type: string
        kind:
          type: string
          description: event (one event in a room), room (a whole room) or user.
          enum:
          - event
          - room
          - user
        status:
          type: string
          enum:
          - open
          - resolved
          - dismissed
        room_id:
          type:
          - string
          - 'null'
        event_id:
          type:
          - string
          - 'null'
        reporter_id:
          type: string
        reported_user_id:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
        score:
          type:
          - integer
          - 'null'
        received_at:
          type: string
          format: date-time
        resolution:
          type:
          - string
          - 'null'
          enum:
          - no_action
          - warned
          - redacted
          - suspended
          - deactivated
          - room_blocked
          - other
          - null
        resolution_note:
          type:
          - string
          - 'null'
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        resolved_by:
          type:
          - string
          - 'null'
          description: The user id of whoever closed it.
        event:
          type:
          - object
          - 'null'
          description: The reported event as this server now holds it (type, sender, origin_server_ts, content; redacted content shows redacted). Only on GET /reports/{id}, and only for an event report whose event this server has.
          properties:
            event_id:
              type: string
            type:
              type: string
            sender:
              type: string
            origin_server_ts:
              type: integer
            content:
              type: object
            redacted:
              type: boolean
    ReportResolve:
      type: object
      required:
      - resolution
      properties:
        resolution:
          type: string
          enum:
          - no_action
          - warned
          - redacted
          - suspended
          - deactivated
          - room_blocked
          - other
        note:
          type: string
    RegistrationToken:
      type: object
      description: A token that lets someone register an account, even while open registration
        is off. `pending` counts registrations that have presented the token and not finished
        yet; `completed` counts accounts created with it. A token is `valid` while it has not
        expired and `pending + completed` is below `uses_allowed` (no limit when null).
      required:
      - token
      - valid
      - uses_allowed
      - pending
      - completed
      - expires_at
      - created_at
      properties:
        token:
          type: string
        valid:
          type: boolean
          description: Whether the token would admit a new registration right now.
        uses_allowed:
          type:
          - integer
          - 'null'
        pending:
          type: integer
        completed:
          type: integer
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    RegistrationTokenCreate:
      type: object
      properties:
        token:
          type: string
          description: The token to create. Omit it to have the server generate one of
            `length` characters. At most 64 characters from `A-Z a-z 0-9 . _ ~ -`.
          maxLength: 64
          pattern: ^[A-Za-z0-9._~-]+$
        uses_allowed:
          type:
          - integer
          - 'null'
          minimum: 0
          description: How many accounts the token may create; null or absent for no limit.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the token stops working; null or absent for never.
        length:
          type: integer
          minimum: 1
          maximum: 64
          description: The length of a generated token, 16 when absent. Ignored when `token` is
            given.
    RegistrationTokenUpdate:
      type: object
      properties:
        uses_allowed:
          type:
          - integer
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    Scope:
      type: string
      description: One of the six scopes of RFC 0004 section 8.2. `admin:write` implies every
        other scope; each `*:write` implies its own `*:read`; `admin:read` satisfies every
        other `:read`.
      enum:
      - admin:read
      - admin:write
      - bridges:read
      - bridges:write
      - moderation:read
      - moderation:write
    AdminToken:
      type: object
      description: An admin API token, as listed. `scopes` is exactly what it was minted with,
        in catalog order; what that lets its holder do follows the rules on `Scope`. The token
        itself is never listed.
      required:
      - id
      - name
      - scopes
      - created_at
      - created_by
      - expires_at
      properties:
        id:
          type: string
          description: A ULID, what revocation and the audit log name the token by.
        name:
          type: string
          description: What the operator called it; not unique.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: The principal that minted it (a user id, or another token's id).
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it stops working; null for never.
    AdminTokenCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: What the token is for, so it can be told from the others. Required; at
            most 100 characters.
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Scope'
          description: The scopes the token carries. Omit it for a full administrator's
            (`admin:read` and `admin:write`). Empty is refused.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the token stops working; null or absent for never. Must be in the
            future.
    AdminTokenCreated:
      allOf:
      - $ref: '#/components/schemas/AdminToken'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: The bearer token (`hsa_` and 40 letters and digits). Shown once; only
              its hash is stored.
    AppService:
      type: object
      properties:
        id:
          type: string
        sender_localpart:
          type: string
        url:
          type:
          - string
          - 'null'
        namespaces:
          type: object
        rate_limited:
          type: boolean
        protocols:
          type: array
          items:
            type: string
        paused:
          type: boolean
        health:
          type: string
          enum:
          - healthy
          - degraded
          - down
          - paused
          - unknown
        created_at:
          type: string
          format: date-time
        bridge_type:
          type:
          - string
          - 'null'
          description: The bridge-type catalogue entry this appservice was created from, read from the registration's `io.myelin.bridge_type` key. Null for a registration that did not come through the catalogue.
        links:
          type: object
          properties:
            login_url:
              type:
              - string
              - 'null'
        queue:
          $ref: '#/components/schemas/AppServiceQueue'
    AppServiceQueue:
      type: object
      description: What waits to be sent to this appservice, read from its delivery queue when the row is answered. Each entry is one room's page of events or one batch of ephemeral data; up to twenty are merged into one transaction. A bridge that keeps up holds pending near 0. The hs_appservice_queue_depth, hs_appservice_queue_dead_lettered and hs_appservice_queue_oldest_age_seconds gauges say the same per appservice.
      required:
      - pending
      - dead_lettered
      properties:
        pending:
          type: integer
          description: Entries waiting to be sent, including any backing off after a failed attempt.
        dead_lettered:
          type: integer
          description: Entries that ran out of delivery attempts and wait for a replay (appservices.replay).
        oldest_pending_age_ms:
          type:
          - integer
          - 'null'
          description: How long the oldest waiting entry has waited, in milliseconds; null when nothing waits.
    AppServiceCreate:
      type: object
      properties:
        registration:
          type: object
        registration_yaml:
          type: string
    AppServiceUpdate:
      type: object
      description: Everything but id and sender_localpart, as a JSON Merge Patch (RFC 7396). A top-level key the registration format does not define is kept with the registration, and null removes it.
      properties:
        io.myelin.provisioning_secret:
          type:
          - string
          - 'null'
          description: The bridge's provisioning.shared_secret (from its config.yaml), with which the server asks a mautrix bridge who has signed in (appservices.logins). A registration made before the server kept one has none; setting it here lets the server ask. null removes it.
      additionalProperties: true
    AppServiceTokens:
      type: object
      properties:
        as_token:
          type: string
        hs_token:
          type: string
    AppServiceHealth:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - down
          - paused
          - unknown
        last_ping_at:
          type:
          - string
          - 'null'
          format: date-time
        last_error:
          type:
          - string
          - 'null'
        last_key_withheld:
          oneOf:
          - $ref: '#/components/schemas/KeyWithheld'
          - type: 'null'
          description: The last `m.room_key.withheld` delivered to one of the appservice's users. A client refused to share a room's keys with the bridge, so the bridge could not read a message and told the person so; `m.unverified` means the person's client excludes devices their owner has not cross-signed, which the manager settles for its own instances' bots. Null until one has been delivered.
        overlaps_offering:
          oneOf:
          - $ref: '#/components/schemas/OfferingOverlap'
          - type: 'null'
          description: Set when this appservice was registered by hand (through the wizard or a registration file) for a network this server now offers as a bridge offering. Its namespace covers the ghost users of every instance the offering makes, so a message for one of them reaches both bridges. Says which offering and what to do; null for any other appservice.
    OfferingOverlap:
      type: object
      required:
      - type
      - name
      - detail
      properties:
        type:
          type: string
          description: The offering's bridge type (catalogue id).
        name:
          type: string
          description: The catalogue's name for it.
        front_door:
          type:
          - string
          - 'null'
          description: The Matrix ID people message to get their own instance; null for a shared type.
        detail:
          type: string
          description: What overlaps and what to do about it, in words for an administrator.
    AppServiceOverlap:
      type: object
      required:
      - id
      - sender_localpart
      - detail
      properties:
        id:
          type: string
          description: The appservice's id.
        sender_localpart:
          type: string
        detail:
          type: string
          description: Why it overlaps the offering and what to do about it, in words for an administrator.
    KeyWithheld:
      type: object
      required:
      - at
      - sender
      - code
      - to_user_id
      - to_device_id
      properties:
        at:
          type: string
          format: date-time
        sender:
          type: string
          description: The client's user, who withheld.
        code:
          type: string
          description: The event's `code`. `m.unverified` for a device its owner has not cross-signed; `m.blacklisted`, `m.unauthorised`, `m.unavailable`, `m.no_olm` as the spec defines them; `unknown` when the event carried none.
        reason:
          type:
          - string
          - 'null'
        room_id:
          type:
          - string
          - 'null'
        to_user_id:
          type: string
          description: The appservice user it was addressed to.
        to_device_id:
          type: string
          description: The device it was addressed to.
    AppServiceBacklogEntry:
      type: object
      properties:
        transaction_id:
          type: string
        age_ms:
          type: integer
        attempts:
