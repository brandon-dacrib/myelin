    delete:
      summary: Forget a destination
      description: Drops everything this server keeps about the destination -- its outbound
        queue (unsent events are lost), its backoff and retry state, its catch-up mark and its
        cached signing keys -- so it is learned again from nothing the next time a room brings
        the two together (decision 0042). Refused with `409 conflict` while this server still
        shares a room with it (a room where both have a joined member), naming how many, unless
        `force=true`. Audited as `federation.destinations.forget`; the event stream carries
        `federation.destination_forgotten`.
