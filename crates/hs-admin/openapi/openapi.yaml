          - integer
          - 'null'
        received_at:
          type: string
          format: date-time
        resolution:
          type:
          - string
          - 'null'
          enum:
          - no_action
          - warned
          - redacted
          - suspended
          - deactivated
          - room_blocked
          - other
          - null
        resolution_note:
          type:
          - string
          - 'null'
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
        resolved_by:
          type:
          - string
          - 'null'
