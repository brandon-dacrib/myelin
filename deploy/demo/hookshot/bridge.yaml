# matrix-hookshot on the demo (deploy/demo/hookshot/README.md): a shared Bridge the operator
# runs from the files Secret `bridge-hookshot-files` (config.yml, registration.yml,
# passkey.pem; made from the templates beside this file, never in git), a second Service for its
# webhooks listener (the operator's own Service carries only the appservice port), and a Funnel
# hostname of its own, https://hookshot.longhair-tet.ts.net, so that GitHub can reach it.
apiVersion: hs.matrix.org/v1alpha1
kind: Bridge
metadata:
  name: bridge-hookshot
  namespace: myelin
  annotations:
    # sha256 of the files Secret's contents; change it when they change, so the pod rolls.
    myelin.dev/files-hash: "FILES_HASH"
spec:
  bridgeType: matrix-hookshot
  appserviceId: hookshot
  image:
    repository: ghcr.io/matrix-org/matrix-hookshot
    tag: 7.5.0
  port: 9993
  filesSecret: bridge-hookshot-files
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bridge-hookshot-webhooks
  namespace: myelin
  labels:
    app.kubernetes.io/name: myelin-bridge
    app.kubernetes.io/instance: bridge-hookshot
spec:
  selector:
    app.kubernetes.io/name: myelin-bridge
    app.kubernetes.io/instance: bridge-hookshot
  ports:
    - name: webhooks
      port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hookshot-funnel
  namespace: myelin
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: bridge-hookshot-webhooks
      port:
        number: 9000
  tls:
    - hosts:
        - hookshot
