[package]
name = "hs-room"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "hs-room: the room actor -- event creation and persistence, extremities, timeline, membership, relations, redactions (track 04)"

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ruma.workspace = true
hs-model = { path = "../hs-model" }
hs-state = { path = "../hs-state" }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
hs-auth = { path = "../hs-auth" }
hs-http = { path = "../hs-http" }
# Added session 7: the admin API's room directory (`hs_admin::sources::RoomDirectory`) is
# implemented in this crate (`crate::admin`) over `RoomRegistry`, per `docs/status/15-admin-api-and-modules.md`'s
# "Interfaces needed". No cycle: `hs-admin` depends on neither `hs-room` nor `hs-auth`.
hs-admin = { path = "../hs-admin" }
# Added session 7: `RoomActor::persist` calls `hs_cluster::Fence::check` as the belt-and-braces
# guard `docs/status/03-cluster.md` names -- see `crate::fencing` and this crate's status file.
# No cycle: `hs-cluster` depends only on `hs-kv`.
hs-cluster = { path = "../hs-cluster" }

[dev-dependencies]
proptest.workspace = true
tower = { workspace = true, features = ["util"] }
hs-testkit = { path = "../hs-testkit" }
# `hs-testkit`'s `FakeClock` calls `tokio::time::advance`, which needs tokio's `test-util`
# feature; `hs-testkit`'s own Cargo.toml does not request it (see
# `docs/status/04-room-and-events.md`), so this crate's tests request it here. Cargo unifies
# features per resolved dependency version across the build graph, so this also fixes
# `cargo test -p hs-testkit` itself once both are in the same build -- a dev-only, additive
# feature request, not a change to `hs-testkit`'s own crate.
tokio = { workspace = true, features = ["test-util"] }
