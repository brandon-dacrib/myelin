apiVersion: v1
kind: Service
metadata:
  name: {{ include "hs.fullname" . }}
  labels:
    {{- include "hs.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hs.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.service.clientPort }}
      targetPort: client
      protocol: TCP
    - name: federation
      port: {{ .Values.service.federationPort }}
      targetPort: federation
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
---
# Headless service backing the StatefulSet's stable network identity
# (pod-0.<fullname>-headless.<namespace>.svc.cluster.local, ...), used by `spec.serviceName`
# above, not intended for client traffic. In cluster mode it is also where the replicas' mesh
# lives: each pod advertises its own name under this Service to its peers, and forwards are
# dialled by that name (see values.yaml, `cluster`). `publishNotReadyAddresses` matters for
# that: a pod's name must resolve before it is ready, because readiness in cluster mode waits
# for its first successful heartbeat, and its peers may forward to it the moment it appears in
# the replica registry.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hs.fullname" . }}-headless
  labels:
    {{- include "hs.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "hs.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.service.clientPort }}
      targetPort: client
      protocol: TCP
    {{- if eq .Values.mode "cluster" }}
    - name: mesh
      port: {{ .Values.cluster.mesh.port }}
      targetPort: mesh
      protocol: TCP
    {{- end }}
