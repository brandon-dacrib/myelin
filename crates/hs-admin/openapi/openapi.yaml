    ServerNotice:
      type: object
      description: One notice sent to one or more local users. Each recipient gets it in their
        own server-notices room (tagged `m.server_notice`), sent by the server-notices user.
      required:
      - id
      - sender
      - type
      - content
      - recipients
      - room_ids
      - event_ids
      - sent_at
      properties:
        id:
          type: string
          description: The notice's identifier in the history.
        sender:
          type: string
          description: The server-notices user the notice was sent as.
        type:
          type: string
          description: The event type that was sent.
        content:
          type: object
          additionalProperties: true
          description: The event content that was sent.
        room_ids:
          type: array
          description: Each recipient's server-notices room, in the order of `recipients`.
          items:
            type: string
        event_ids:
          type: array
          items:
            type: string
        recipients:
          type: array
          items:
            type: string
        sent_at:
          type: string
          format: date-time
    ServerNoticeCreate:
      type: object
      required:
      - recipients
      - content
      properties:
        recipients:
          type: array
          minItems: 1
          description: Local user IDs to send the notice to. Every one must exist; nothing is
            sent if any does not.
          items:
            type: string
        content:
          type: object
          additionalProperties: true
          description: The event content, for example `{"msgtype":"m.text","body":"..."}`.
        type:
          type: string
          default: m.room.message
        state_key:
          type:
          - string
          - 'null'
    ServerInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        build:
          type: string
        supported_room_versions:
          type: array
          items:
            type: string
        enabled_components:
          type: array
          items:
            type: string
        uptime_ms:
          type: integer
        contract_version:
          type: string
    SetupStatus:
      type: object
      required:
      - needs_setup
      properties:
        needs_setup:
          type: boolean
          description: True while this server has no administrator and is offering to create one. False from the moment one exists, however it came to.
    SetupRequest:
      type: object
      required:
      - setup_token
      - username
      - password
      properties:
        setup_token:
          type: string
          description: The token from the setup link in the server's log.
        username:
          type: string
          description: The localpart of the account to create, `alice` for `@alice:example.org`. A full user ID on this server is accepted too.
        password:
          type: string
          description: Checked against the server's password policy.
    SetupSession:
      type: object
      required:
      - user_id
      - access_token
      - device_id
      properties:
        user_id:
          type: string
        access_token:
          type: string
          description: An ordinary access token for the new account, which, being an administrator's, this API accepts.
        device_id:
          type: string
    RecoveryLinkRequest:
      type: object
      required:
      - key_id
      - requested_at_ms
      - nonce
      - signature
      properties:
        key_id:
          type: string
          description: The signing key's ID, `ed25519:<version>`, as `/_matrix/key/v2/server` publishes it. Must be this server's current key.
        requested_at_ms:
          type: integer
          format: int64
          description: When the request was signed, milliseconds since the Unix epoch. Accepted within five minutes of the server's clock.
        nonce:
          type: string
          description: Random, 8 to 64 characters, never reused. A request whose nonce this server has seen is refused.
        signature:
          type: string
          description: Unpadded base64 of the Ed25519 signature over the message `hs.recovery-link.v1\n<requested_at_ms>\n<nonce>\n`, the layout `hs recover` and the server share.
    RecoveryLink:
      type: object
      required:
      - kind
      - link
      properties:
        kind:
          type: string
          enum:
          - recovery
          - setup
          description: '`recovery` is a link to the recovery page. `setup` means this server has no active administrator, so the first-run setup link was issued instead, which creates one.'
        link:
          type: string
          description: Rooted at the public base URL when there is one, otherwise at `localhost` on the client port. The token is in the fragment, so it is never sent to the server by a browser.
        expires_at_ms:
          type: integer
          format: int64
          description: When a `recovery` link stops working. Absent for a `setup` link, which is offered until it is used.
    RecoveryInspectRequest:
      type: object
      required:
      - recovery_token
      properties:
        recovery_token:
          type: string
          description: The token from the link's fragment.
    RecoveryInspection:
      type: object
      required:
      - administrators
      - expires_at_ms
      properties:
        administrators:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryAdministrator'
          description: The active administrator accounts, any of whose password this link may reset.
        expires_at_ms:
          type: integer
          format: int64
    RecoveryAdministrator:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
    RecoveryResetRequest:
      type: object
      required:
      - recovery_token
      - user_id
      - password
      properties:
        recovery_token:
          type: string
        user_id:
          type: string
          description: The administrator account to reset, a full user ID on this server.
        password:
          type: string
          description: The new password, checked against the server's password policy.
