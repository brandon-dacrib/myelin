{{- if .Values.bridges.enabled }}
{{- /*
What the homeserver itself may do to deploy bridges (docs/rfcs/0017, 4.5), in this namespace
only: write `Bridge` resources and the Secrets holding their files. The operator does the rest.
*/}}
{{- $name := printf "%s-bridges" (include "hs.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "hs.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hs.matrix.org"]
    resources: ["bridges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "hs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hs.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
