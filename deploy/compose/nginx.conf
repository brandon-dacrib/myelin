# nginx in front of Myelin, for a host that already runs nginx (the Compose example uses Caddy).
# Certificates from certbot (`certbot --nginx -d matrix.example.org -d example.org`) or your own.
# Validated with `nginx -t` on 2026-10-16; docs/deployment.md, "Listeners, TLS and the reverse
# proxy", is the guide this belongs to.

events {}

http {
    # Where clients reach the server.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name matrix.example.org;

        ssl_certificate     /etc/letsencrypt/live/matrix.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/matrix.example.org/privkey.pem;

        # Uploads: the server's own limit is media.max_upload_size (50 MiB by default).
        client_max_body_size 50m;

        # Everything the server serves: /_matrix, /.well-known/matrix, /_synapse, /admin,
        # /api/v1 and the landing page.
        location / {
            proxy_pass http://127.0.0.1:8008;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # /sync is a long poll of up to 30 s plus the client's timeout.
            proxy_read_timeout 120s;
        }
    }

    # The server name. Other servers and clients look here for where the server is. Delete
    # this block if something else serves example.org, and serve the two documents there.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name example.org;

        ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

        location /.well-known/matrix/ {
            proxy_pass http://127.0.0.1:8008;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name matrix.example.org example.org;
        return 301 https://$host$request_uri;
    }
}
