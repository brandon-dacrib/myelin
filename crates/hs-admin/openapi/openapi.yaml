  /federation/destinations/prune:
    post:
      summary: Forget unused and failing destinations
      description: 'Forgets every destination this server shares no room with and has nothing
        queued for (it is state, not a relationship: decision 0042) and, when the body gives
        `failing_for`, every destination failing for at least that long whose queued events
        are only for rooms this server has since left (the queue is dropped with it). A
        destination this server shares a room with, or with events queued for a room it is
        still in, is kept; so is one with a queue that is not failing (the events will be
        delivered) or not failing for long enough. The report counts both sides by reason and
        names the first 50 of each. `dry_run=true` answers the same report without forgetting
        anything. Audited as `federation.destinations.prune` (not when a dry run); the event
        stream carries `federation.destinations_pruned`.'
