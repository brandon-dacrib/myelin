name: fuzz

# Every cargo-fuzz target (crates/hs-federation/fuzz, crates/hs-media/fuzz) built on nightly and
# run for 60 s each from its checked-in seed corpus (tests/fuzz/run_all.sh; status 14 has the
# 10-minute baseline).
#
# Its own workflow, not a job in `ci`: a nightly toolchain can break the build for reasons that
# are not this repository's, and `cd`'s "require green ci" step reads the whole `ci` run's
# conclusion, so a red fuzz job there blocked every image. Here it still fails red and uploads a
# crash's input, so a finding is seen on the commit that exposed it, without deciding whether
# that commit ships.
#
# The red runs from 2026-10-01 to 2026-10-02 ("could not compile `cfg-if` due to 2 previous
# errors") were not nightly's doing: install-action's prebuilt cargo-fuzz is a musl binary, and
# cargo-fuzz defaults `--target` to the triple it was compiled for, so it built for
# x86_64-unknown-linux-musl (no rust-std, and ASAN cannot link a static libc). The runner
# script passes `--target` as rustc's host now; status 12 (2026-10-02) has the run ids.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 2

jobs:
  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/hs-federation/fuzz
            crates/hs-media/fuzz
      - run: tests/fuzz/run_all.sh 60
        env:
          FUZZ_OUT: ${{ runner.temp }}/fuzz-runs
          FUZZ_REQUIRE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: |
            crates/*/fuzz/artifacts/
            ${{ runner.temp }}/fuzz-runs/**/fuzz.log
          retention-days: 14
