[package]
name = "hs-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "kube-rs CRD schemas (Homeserver, AppService, Bridge, PushGateway, IdentityService) and reconcile loops (track 12)"

[[bin]]
name = "gen-crds"
path = "src/bin/gen_crds.rs"

[dependencies]
kube = { workspace = true }
k8s-openapi = { workspace = true }
# Pinned separately from the workspace's schemars "1" (used by hs-config and others): kube-core
# 1.1.0's `#[derive(CustomResource)]` macro is built against schemars 0.8 internally (see the note
# on the root Cargo.toml's `k8s-openapi` entry), so the `JsonSchema` impls this crate's CRD structs
# need must come from the same 0.8 line for kube_derive's generated code to find them. Noted here
# per docs/workstreams/12-platform-and-kubernetes.md's brief ("record the addition in your status
# file"); see docs/status/12-platform-and-kubernetes.md.
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
# The pod-template spec hash (`bridge::spec_hash`) that rolls a bridge's pod when its spec changes.
sha2 = { workspace = true }
hex = { workspace = true }
# `kube`'s `rustls-tls` feature needs a process-level `rustls::crypto::CryptoProvider` installed
# before the first TLS connection, and a binary linking more than one provider has no default.
# `connect()` in `src/lib.rs` (used by `hs operator` and the homeserver's bridge client) installs
# `ring`. See `crates/hs-cluster/src/mesh/tls.rs::provider` for the same `ring` choice made elsewhere in this
# workspace (matching the workspace's own `rustls` feature pin: `features = ["ring", ...]`).
rustls = { workspace = true }
# The `Homeserver` reconciler drains replicas through the server's admin API.
reqwest = { workspace = true }
# Its client is built by `hs_http::client::builder()`: the outbound address policy and the
# `hs_outbound_*` counters, the same as every other outbound client in the workspace.
hs-http = { path = "../hs-http" }
# `hs_operator_*` metrics, in the project's registry and naming conventions, served on
# `/metrics` by a small axum listener (`src/metrics.rs`).
hs-telemetry = { path = "../hs-telemetry" }
prometheus-client = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
