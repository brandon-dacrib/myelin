name: cd

# Continuous delivery for Myelin: multi-architecture container images, standalone binaries, and
# the Helm chart.
#
# CI (`ci.yml`) proves the tree is good — fmt, clippy and tests on both architectures, plus an
# advisory audit. This workflow only produces artifacts, and only from a commit CI already agreed
# with, so a release can never be built from something that does not compile on one of its
# supported architectures.
#
# # What triggers what
#
# | trigger | images | binaries | chart | published |
# |---|---|---|---|---|
# | push to `main` | yes, tagged `main` and the commit sha | no | yes, a pre-release pinned to that image | yes |
# | tag `v*` | yes, tagged with the version and `latest` | yes, attached to the release | yes | yes |
# | manual dispatch | unless `images` is off | if asked | no | only if asked |
#
# A manual dispatch with `binaries` on and `images` off is the release binaries' dry run: the
# same matrix a `v*` tag runs -- the management interface built with Node, embedded, the binary
# booted and its `/admin/` checked -- uploaded as workflow artifacts, with no tag, no GitHub
# release and nothing pushed. `gh workflow run cd --ref <branch> -f binaries=true -f images=false`
# (the gate below still waits for CI to pass on that commit first).
#
# # Why the image is built twice over
#
# The binary is genuinely dual-architecture — a stated goal of this project is that the same
# server runs in a Kubernetes cluster and on a small ARM host — so the image is built for
# `linux/amd64` and `linux/arm64` and published as one manifest list. They are built on native
# runners rather than under emulation: a Rust compile under QEMU takes long enough to dominate the
# whole pipeline, and this workspace is large.
#
# # What has to be true before anything is tagged
#
# Each `image` leg boots the image it just built with the README's `docker run` line and checks
# it answers; the amd64 leg then installs the Helm chart with that image on a kind cluster, one
# value, and claims the server through the setup link the pod logs, then runs the operator on the
# same cluster against a `Bridge` and a `Homeserver` (deploy/operator/ci/kind-smoke.sh). All of
# it happens inside `image`, so a failure there means `manifest` never runs: no tag moves, no
# chart is published. The `chart` job's own check afterwards is of what reached the registry,
# not a second gate.
#
# # Provenance
#
# Each image gets an SBOM and build provenance attached. That is not ceremony for a homeserver:
# an operator running someone else's Matrix server wants to know exactly what is inside it, and
# `docs/decisions/0001-license.md` commits this project to being auditable about what it ships.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to the registry (otherwise build only)"
        type: boolean
        default: false
      binaries:
        description: "Also build standalone binaries"
        type: boolean
        default: false
      images:
        description: "Build and smoke-test the images (off for a binaries-only dry run)"
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------
  # Wait for CI on this exact commit. A release built from a commit whose tests never passed is
  # worse than no release, and a tag push does not re-run the push workflow.
  # ---------------------------------------------------------------------------------------------
  gate:
    name: require green ci
    runs-on: ubuntu-24.04
    steps:
      # Deliberately a plain poll rather than a wait-for-check action. Both workflows trigger on
      # the same push, so when this starts, CI's summary job does not exist yet — it is the last
      # job in that workflow and depends on the rest. A check-waiting action looks for it, finds
      # nothing, and exits immediately with "the requested check was never run against this ref",
      # which fails the release for the one reason it must not: CI being fine but not finished.
      #
      # Polling the workflow run itself treats "not created yet" as "keep waiting", which is what
      # was meant.
      - name: Wait for the ci workflow to succeed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" \
                    --workflow ci --limit 1 --json status,conclusion,url)
            status=$(jq -r '.[0].status // "absent"' <<<"$run")
            conclusion=$(jq -r '.[0].conclusion // ""' <<<"$run")
            case "$status" in
              absent|queued|in_progress|waiting|requested|pending)
                echo "ci is $status; waiting"
                ;;
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "ci succeeded: $(jq -r '.[0].url' <<<"$run")"
                  exit 0
                fi
                echo "ci concluded '$conclusion'; refusing to build a release from it" >&2
                jq -r '.[0].url' <<<"$run" >&2
                exit 1
                ;;
              *)
                echo "unexpected ci status '$status'" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "ci did not finish within an hour; not releasing" >&2
          exit 1

  # ---------------------------------------------------------------------------------------------
  # One image per architecture, built natively, pushed by digest only. The manifest list that
  # gives them a human-readable tag is assembled afterwards.
  # ---------------------------------------------------------------------------------------------
  image:
    name: image (${{ matrix.arch }})
    needs: gate
    if: github.event_name != 'workflow_dispatch' || inputs.images
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # The cargo registry and the compiled dependency graph are the expensive part; scope the
          # cache per architecture so the two runners never fight over one key.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          provenance: true
          sbom: true

      - name: Prove the image actually runs before it is released
        # A pushed image that has never answered a request is not a release candidate, and this
        # project has shipped "verified" things that could not serve a single request more than
        # once. It is also why the arm64 leg runs on a native runner: the check is only meaningful
        # if the binary actually executes.
        #
        # The image is distroless and has no shell, so every step here execs the binary directly.
        # It takes a mounted config (see deploy/Dockerfile's CMD), not environment variables, and
        # the storage directory has to be somewhere a non-root uid can write.
        run: |
          set -euo pipefail
          docker buildx build --load --platform ${{ matrix.platform }} \
            -f deploy/Dockerfile -t myelin:smoke .

          # Exactly the command the README gives: no config file, a named volume, one variable.
          # If this stops working, the quickstart has stopped working.
          docker run -d --name myelin-smoke -p 8008:8008 \
            -v myelin-smoke:/data \
            -e HS__SERVER__SERVER_NAME=smoke.invalid \
            myelin:smoke

          ok=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8008/health/live >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "the image never answered /health/live; logs follow" >&2
            docker logs myelin-smoke >&2 || true
            docker rm -f myelin-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          echo "health/live answered; asking what it supports:"
          curl -sf http://127.0.0.1:8008/_matrix/client/versions | head -c 200
          echo

          # The image has to carry the management interface, not the page that says it was left
          # out. Both answer 200, so look at what came back.
          admin="$(curl -sf http://127.0.0.1:8008/admin/)"
          if ! printf '%s' "$admin" | grep -q '<div id="root">'; then
            echo "/admin/ is not the management interface; it served:" >&2
            printf '%s\n' "$admin" | head -20 >&2
            docker rm -f myelin-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          # And a new server has to say how to get into it.
          if ! docker logs myelin-smoke 2>&1 | grep -q 'setup_link=http://localhost:8008/admin/setup#token='; then
            echo "the first boot did not log a setup link; logs follow" >&2
            docker logs myelin-smoke >&2 || true
            docker rm -f myelin-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          echo "/admin/ serves the interface, and the log offers a setup link"
          docker rm -f myelin-smoke >/dev/null

      - name: Start a kind cluster
        # For the next step; only on the leg that runs it. The action installs kind and kubectl
        # and waits for the node to be Ready (about a minute on these runners). Helm is on the
        # runner image already, and set up explicitly below as the `chart` job does.
        if: matrix.arch == 'amd64'
        uses: helm/kind-action@v1
        with:
          cluster_name: smoke

      - uses: azure/setup-helm@v4
        if: matrix.arch == 'amd64'

      - name: Prove the chart installs that image with one value, before anything is tagged
        # The docker step above proves the image boots under `docker run`. This proves the
        # other half of the quickstart, `helm install myelin <chart> --set serverName=...`,
        # with the same image: a kind cluster, the chart from this checkout, `myelin:smoke`
        # loaded onto the node and pinned with pullPolicy Never so nothing is pulled, and then
        # what an operator does next -- wait for Ready, read the setup link out of the pod log,
        # check /health/ready and that /admin/ is the interface through a port-forward, and
        # claim the server through that link. deploy/helm/hs/ci/install-smoke.sh does it, as a
        # script rather than steps, so the same check runs by hand against any cluster and its
        # output reads as a transcript.
        #
        # Why here, and not a job of its own or the `chart` job:
        #
        # - It has to run before `manifest`. `manifest` creates the tags an operator can pull,
        #   and `chart` (which needs `manifest`) publishes the chart that names them. A check
        #   that fails after either has happened is a report, not a gate: the broken image is
        #   already `main`. A failing step here fails this job, `manifest` never runs, and
        #   neither does anything after it.
        # - The image is already here. `myelin:smoke` was built and loaded by the step above,
        #   from the same context and layer cache as the digest that was pushed. A job of its
        #   own would build it a third time, or log in and pull the untagged digest back, and
        #   would then need a special case for a manual dispatch that pushed nothing.
        # - Only the amd64 leg. The chart does not know what architecture it runs on, and the
        #   arm64 binary is already proven by the docker step on its native runner; a second
        #   kind cluster there would cost the same minute and prove nothing new. Measured on
        #   2026-09-26 (docs/status/12-platform-and-kubernetes.md): the install itself is
        #   seventeen seconds from `helm install` to Ready on kind.
        #
        # The `chart` job keeps its own check, pulling the *published* chart back and rendering
        # it, because that is the one thing this step cannot see: what reached the registry.
        if: matrix.arch == 'amd64'
        run: deploy/helm/hs/ci/install-smoke.sh myelin:smoke --kind smoke

      - name: Prove the operator reconciles a Bridge and a Homeserver on that cluster
        # The same kind cluster and image, after the install smoke has cleaned up after itself.
        # deploy/operator/ci/kind-smoke.sh installs the chart again and checks its bridge
        # operator end to end: a hand-written `Bridge` (nginx standing in for a bridge) becomes
        # a claim, a Deployment and a Service owned by it and goes Ready; a missing image turns
        # it Degraded with the kubelet's reason and putting it back makes it Ready again;
        # deleting it removes everything built from it. `--homeserver` then runs
        # `hs operator --homeservers` from deploy/operator/ on a single-node `Homeserver`: the
        # chart's objects, Ready, an image change rolled through the StatefulSet partition,
        # deletion. Until 2026-10-01 neither controller had ever run against an API server.
        #
        # Here, in the gate, for the reason the install smoke is: a failure stops `manifest`.
        # About three to four minutes on a loaded desktop's kind (docs/status/12, 2026-10-01).
        # The script's `--heisenbridge` walk (the server deploying a real bridge itself) is
        # left out: it pulls `hif1/heisenbridge:latest` from Docker Hub, and a release should
        # not wait on someone else's moving tag.
        if: matrix.arch == 'amd64'
        run: deploy/operator/ci/kind-smoke.sh myelin:smoke --kind smoke --homeserver

      - name: Export the digest
        id: export
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  # Combine the per-architecture digests into one tag an operator can actually pull.
  # ---------------------------------------------------------------------------------------------
  manifest:
    name: manifest list
    needs: image
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push the manifest list
        run: |
          set -euo pipefail
          digests=""
          for d in "${{ needs.image.outputs.digest-amd64 }}" "${{ needs.image.outputs.digest-arm64 }}"; do
            [ -n "$d" ] && digests="$digests ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$d"
          done
          # shellcheck disable=SC2086
          for tag in $(jq -r '.tags[]' <<<'${{ steps.meta.outputs.json }}'); do
            docker buildx imagetools create -t "$tag" $digests
          done

      - name: Show what was published
        run: |
          jq -r '.tags[]' <<<'${{ steps.meta.outputs.json }}' | while read -r tag; do
            echo "== $tag"
            docker buildx imagetools inspect "$tag" | head -20
          done

  # ---------------------------------------------------------------------------------------------
  # Standalone binaries. This project promises "the same binary on a small ARM host", so the
  # release carries one per target rather than only an image.
  # ---------------------------------------------------------------------------------------------
  binaries:
    name: binary (${{ matrix.target }})
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.binaries)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # The management interface is embedded in the binary, so it is built first.
      # HS_ADMIN_WEB_DIST makes `crates/hs-admin/build.rs` fail the build rather than quietly
      # embed its placeholder page if that step ever goes missing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the management interface
        working-directory: web
        run: npm ci && npm run build

      - run: cargo build --release --locked -p hs-cli --bin hs --target ${{ matrix.target }}
        env:
          HS_ADMIN_WEB_DIST: ${{ github.workspace }}/web/dist

      - name: Check the binary serves, and that /admin/ is the interface it embedded
        # The binary is the release, so it is booted rather than asked for a version (which `hs`
        # does not have a flag for: the `--version || true` this replaced always "passed"). The
        # same checks as the image's smoke test: it answers /health/live, /admin/ is the
        # management interface (not the page saying it was left out; both answer 200), and a new
        # server logs its setup link. Native runners for every target, so it really executes.
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/hs"
          data="$(mktemp -d)"
          "$bin" serve --data-dir "$data" --server-name smoke.invalid > serve.log 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8008/health/live >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "the binary never answered /health/live; its log follows" >&2
            cat serve.log >&2
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          admin="$(curl -sf http://127.0.0.1:8008/admin/)"
          if ! printf '%s' "$admin" | grep -q '<div id="root">'; then
            echo "/admin/ is not the management interface; it served:" >&2
            printf '%s\n' "$admin" | head -20 >&2
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          if ! grep -q 'setup_link' serve.log; then
            echo "the first boot did not log a setup link; its log follows" >&2
            cat serve.log >&2
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "the binary serves, /admin/ is the interface, and the log offers a setup link"
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Package
        run: |
          set -euo pipefail
          # The tag on a release; on a manual dry run the ref is a branch, which may hold a `/`
          # (agent/x), so the archive is named for the commit instead.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="manual-${GITHUB_SHA::12}"
          fi
          dir="myelin-${label}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/hs" "$dir/"
          cp README.md LICENSE "$dir/" 2>/dev/null || true
          tar -czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: myelin-${{ matrix.target }}
          path: |
            myelin-*.tar.gz
            myelin-*.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The Helm chart, published as an OCI artifact beside the image so `helm install` can pull it
  # from the same place -- on every push to `main` as well as on a tag, because "install is one
  # value" is only true when there is something to install from.
  #
  # A push to `main` publishes a pre-release of the version in Chart.yaml,
  # `<version>-main.<run number>.g<short sha>`, whose appVersion is the `sha-<commit>` image tag
  # this same workflow run has just published, so a chart and the image it pulls always come
  # from one commit. `helm install --devel` picks the newest of them. A plain `helm install`
  # picks releases only, so the day `v0.1.0` is tagged the pre-releases stop being what an
  # operator gets by default. `--devel` keeps seeing `main` after that without a Chart.yaml
  # bump: once a tag has released Chart.yaml's version, `<version>` is the patch after the
  # newest tag (`0.1.1-main.N` sorts above `0.1.0`; deploy/helm/hs/ci/chart-version.sh).
  #
  # It waits for the manifest list rather than the gate so the image it points at exists before
  # anything can pull the chart that names it. That the chart *installs* was already proven by
  # then, in `image`'s amd64 leg, with this same commit's image and before its tags existed;
  # this job's check at the end is of the published artifact.
  # ---------------------------------------------------------------------------------------------
  chart:
    name: helm chart
    needs: manifest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint and template before publishing anything
        # A server name is the one value the chart requires, so it is supplied to make rendering
        # possible. Cluster mode is rendered too, with the signing-key Secret and the mesh
        # authentication it insists on.
        run: |
          set -euo pipefail
          helm lint deploy/helm/hs --set serverName=example.org
          helm template myelin deploy/helm/hs --set serverName=example.org > /dev/null
          helm template myelin deploy/helm/hs --set serverName=example.org --set mode=cluster \
            --set storage.backend=postgres --set storage.postgres.host=db --set media.storage.backend=s3 \
            --set media.storage.s3.bucket=media --set secrets.signingKey.existingSecret=example \
            --set cluster.mesh.tls.existingSecret=example-mesh > /dev/null
          # Bridges off renders no operator, no RBAC and no bridge environment on the server.
          if helm template myelin deploy/helm/hs --set serverName=example.org --set bridges.enabled=false \
              | grep -E 'bridges-operator|MYELIN_BRIDGES|hs\.matrix\.org'; then
            echo "bridges.enabled=false still rendered bridge objects" >&2
            exit 1
          fi
          # The chart's copy of the Bridge CRD is the generated one (gen-crds writes both), and
          # it is a template (applied on every upgrade, kept on uninstall: decision 0036), not
          # a file in crds/, which Helm installs once and never upgrades.
          diff -u deploy/crds/bridge.yaml deploy/helm/hs/files/crds/bridge.yaml
          test ! -e deploy/helm/hs/crds
          helm template myelin deploy/helm/hs --set serverName=example.org --show-only templates/crds.yaml \
            | grep -q 'helm.sh/resource-policy: keep'

      - name: Work out the chart version and the image it pulls
        # deploy/helm/hs/ci/chart-version.sh has the rule and why: a tag publishes its version;
        # `main` publishes `<base>-main.<run>.g<sha>`, where `<base>` moves past the newest `v*`
        # tag by itself, so `--devel` keeps picking `main` after a release without anybody
        # having to bump Chart.yaml. Its self-test runs first, so a broken rule fails here
        # before anything is pushed.
        id: version
        run: |
          set -euo pipefail
          deploy/helm/hs/ci/chart-version.sh --self-test
          git fetch --tags --force --quiet origin
          chart="$(helm show chart deploy/helm/hs | sed -n 's/^version: *//p')"
          # shellcheck disable=SC2046
          deploy/helm/hs/ci/chart-version.sh "$GITHUB_REF" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" \
            "$chart" $(git tag -l 'v*') | tee -a "$GITHUB_OUTPUT"

      - name: Package and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          helm package deploy/helm/hs --version "$VERSION" --app-version "$APP_VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push "hs-$VERSION.tgz" "oci://$REGISTRY/${{ github.repository_owner }}/charts"

      - name: Prove the published chart pulls back, and names an image that exists
        # `helm push` succeeding is not the same as `helm install` working. Pull the chart back
        # from the registry by the version just published, render it, and check that the image
        # it would run is in the registry too -- the whole point of publishing them together.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir pulled
          helm pull "oci://$REGISTRY/${{ github.repository_owner }}/charts/hs" --version "$VERSION" -d pulled
          image="$(helm template myelin "pulled/hs-$VERSION.tgz" --set serverName=example.org \
                    | sed -n 's/^ *image: *//p' | tr -d '"' | head -1)"
          echo "the published chart renders image $image"
          if [ "${image##*:}" != "$APP_VERSION" ]; then
            echo "expected it to pull the tag $APP_VERSION" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$image" > /dev/null
          echo "and that image is in the registry"

  # ---------------------------------------------------------------------------------------------
  # The release itself, only once everything that feeds it has succeeded.
  # ---------------------------------------------------------------------------------------------
  release:
    name: github release
    needs: [manifest, binaries, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: myelin-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            myelin-*.tar.gz
            myelin-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            Multi-architecture (`linux/amd64`, `linux/arm64`), with an SBOM and build provenance
            attached, smoke-tested on both architectures before publication, and installed with
            the Helm chart below on a kind cluster before anything was tagged.

            ## Helm chart

            ```
            helm install myelin oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/hs \
              --version ${GITHUB_REF_NAME#v} \
              --set serverName=example.org
            ```
