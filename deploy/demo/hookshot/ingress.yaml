# The demo's public hostname for Hookshot's webhooks listener: a Tailscale Funnel Ingress at
# https://hookshot.longhair-tet.ts.net, pointed at the Service the operator makes for the
# offering's instance (`bridge-hookshot`, port `webhooks` = 9000). The bridge itself is the
# `matrix-hookshot` offering in ../values-bridges.yaml; this is the one object the server does
# not make (docs/bridges/hookshot.md, "Reaching the webhooks listener from outside").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hookshot-funnel
  namespace: myelin
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: bridge-hookshot
      port:
        name: webhooks
  tls:
    - hosts:
        - hookshot
