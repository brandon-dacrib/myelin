apiVersion: v2
name: hs
description: >-
  Myelin, a modern Matrix homeserver in Rust. One value installs it: `helm install myelin
  <chart> --set serverName=example.org` is a running server with its signing key, database and
  media on one volume and a one-time setup link for the first administrator in its log. Values
  are modeled on element-hq/ess-helm's Synapse component so the chart can take its place in an
  Element Server Suite Community deployment: single-node and cluster modes, CloudNativePG
  integration, object storage, probes, a PodDisruptionBudget, anti-affinity, an HPA, a
  ServiceMonitor, and Ingress/Gateway API routing. docs/status/12-platform-and-kubernetes.md
  records what has been verified against a real cluster and what has only been rendered.
type: application
version: 0.2.0
# The image tag the chart pulls when `image.tag` is unset. `main` is the continuously published
# build, and is what a chart installed from a checkout pulls. CD's `helm package --app-version`
# replaces it in every chart it publishes: with `sha-<commit>` on a push to `main`, so the
# pre-release chart pulls the image built from the same commit, and with the version on a `v*`
# tag.
appVersion: "main"
keywords:
  - matrix
  - homeserver
  - chat
home: https://github.com/brandon-dacrib/myelin
sources:
  - https://github.com/brandon-dacrib/myelin
  - https://github.com/element-hq/ess-helm
maintainers:
  - name: track-12-platform-and-kubernetes
