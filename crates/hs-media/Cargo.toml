[package]
name = "hs-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Media repository: object-store backed uploads, downloads, thumbnails and the security rules around them (track 09)"

[features]
# `test-fixtures` defaults on: it is dev/test-only *code* (gated behind the feature, not
# `#[cfg(test)]`, because the separate `hs-media-fuzz` crate also needs it as an ordinary
# path-dependency feature, outside `cargo test`'s dev-dependency graph) but has no runtime cost
# for a production binary that never calls into `crate::test_fixtures`, so defaulting it on keeps
# `cargo check -p hs-media` / `cargo test -p hs-media` working with no extra flags.
default = ["test-fixtures"]
# Extra object_store backends. Off by default to keep the dependency tree lean.
gcp = ["object_store/gcp"]
azure = ["object_store/azure"]
# Synthetic/adversarial test image generation (`crate::test_fixtures`), used by this crate's own
# tests, the `gen_fixtures` example that writes `tests/fixtures/`, and the `hs-media-fuzz` crate's
# seed corpus.
test-fixtures = ["dep:crc32fast"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
http.workspace = true
image.workspace = true
object_store.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ruma.workspace = true
crc32fast = { workspace = true, optional = true }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
hs-auth = { path = "../hs-auth" }
hs-http = { path = "../hs-http" }
hs-config = { path = "../hs-config" }
icap-rs.workspace = true
reqwest.workspace = true
serde_yaml_ng.workspace = true
schemars.workspace = true
base64.workspace = true
prometheus-client.workspace = true
hs-telemetry = { path = "../hs-telemetry" }
# URL preview (`crate::preview`): the SSRF blocklist follows the exact same CIDR-list-over-`ipnet`
# design `hs-federation`'s `IpPolicy` uses for its own `ip_range_blocklist` (see
# `docs/status/09-media.md` for why this crate does not depend on `hs-federation` directly to
# reuse that type verbatim: pulling in federation's discovery/mesh dependency graph for one ~20
# line struct was not worth it, but the *policy design* -- parse CIDRs, block unless allowed --
# is deliberately identical code shape, not a second design).
ipnet.workspace = true
# URL preview: lenient OpenGraph `<meta>`/`<title>` tag extraction (`crate::preview::opengraph`).
# A full HTML parser (`html5ever`/`scraper`) was considered and deliberately not added: OG tags
# only ever need `<meta>`/`<title>` attribute extraction, and Synapse itself does not do a strict
# DOM parse for this either -- see that module's doc for the exact tradeoff.
regex.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "thumbnails"
harness = false
