<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Myelin admin</title>
    <!-- Inline data-URI favicon: the browser requests /favicon.ico at the
         origin root regardless of the app's /admin/ base path, which
         otherwise 404s (harmless, but noisy in the console every load). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234f46e5'/%3E%3Cpath d='M6 12h4M14 8h4M14 16h4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='12' r='1.5' fill='white'/%3E%3Ccircle cx='14' cy='8' r='1.5' fill='white'/%3E%3Ccircle cx='14' cy='16' r='1.5' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme/accent.
      // Kept in sync with src/lib/theme.ts; do not add logic here that isn't
      // mirrored there, and vice versa.
      (function () {
        try {
          var theme = localStorage.getItem("hs-admin:theme");
          var accent = localStorage.getItem("hs-admin:accent");
          var root = document.documentElement;
          if (theme === "light" || theme === "dark") {
            root.setAttribute("data-theme", theme);
          }
          if (accent) {
            root.setAttribute("data-accent", accent);
          }
        } catch (_e) {
          /* localStorage unavailable (private mode, blocked storage): fall
             back to prefers-color-scheme and the default accent. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
