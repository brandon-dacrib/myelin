# UNTESTED (see deploy/chaos/README.md). toxiproxy sits in front of postgres; every replica
# connects to `toxiproxy:5433` instead of `postgres:5432` directly. `scenario-slow-store.sh` calls
# the toxiproxy HTTP API (port 8474) to add and remove a latency toxic on the `postgres` proxy
# without restarting anything.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: hs-chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.9.0
          args:
            - "-host=0.0.0.0"
          ports:
            - containerPort: 8474
              name: api
            - containerPort: 5433
              name: postgres
          readinessProbe:
            httpGet:
              path: /version
              port: 8474
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: hs-chaos
spec:
  selector:
    app: toxiproxy
  ports:
    - name: api
      port: 8474
      targetPort: 8474
    - name: postgres
      port: 5433
      targetPort: 5433
