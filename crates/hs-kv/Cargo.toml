[package]
name = "hs-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "hs-kv: ordered, transactional key-value abstraction. Track 01 (docs/workstreams/01-storage-engine.md)."

[[bench]]
name = "kv_bench"
harness = false

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
fjall = { workspace = true }
tracing = { workspace = true }
postgres = { workspace = true }
r2d2 = { workspace = true }
r2d2_postgres = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
# Only for `tests/postgres_conformance.rs`'s `postgres_survives_being_opened_and_called_from_
# inside_a_tokio_runtime` test, which must run inside a real ambient multi-threaded Tokio runtime
# to prove `PostgresBackend` tolerates it (see `docs/status/01-storage-engine.md`, session 3).
# Already a `[workspace.dependencies]` entry (used by several async crates); not new to the
# workspace.
tokio = { workspace = true }
