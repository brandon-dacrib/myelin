    BridgeTypeRenderResult:
      type: object
      properties:
        registration:
          type: object
        registration_yaml:
          type: string
        config_yaml:
          type:
          - string
          - 'null'
          description: The bridge's own `config.yaml` with everything that ties it to this server filled in (mautrix bridges); null when the render writes no config for this type.
        compose_yaml:
          type: string
        bridge_resource_yaml:
          type: string
    BridgeDeploymentTarget:
      type: object
      required:
      - available
