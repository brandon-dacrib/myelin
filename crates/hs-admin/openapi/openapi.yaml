        runtime:
          type: string
          enum:
          - cluster
          - elsewhere
          description: '`cluster`: this server deploys each instance. `elsewhere`: an administrator runs each instance from its files.'
        image_tag:
          type: string
        access:
          $ref: '#/components/schemas/BridgeOfferingAccess'
        options:
          $ref: '#/components/schemas/BridgeOfferingOptions'
    BridgeOffering:
      type: object
      required:
      - type
      - mode
      - enabled
      - runtime
      properties:
        type:
          type: string
          description: The bridge type (catalogue id).
        name:
          type: string
        mode:
          type: string
          enum:
          - per_user
          - shared
        enabled:
          type: boolean
        runtime:
          type: string
          enum:
          - cluster
          - elsewhere
        image:
          type: string
          description: The full image reference instances run.
        image_tag:
          type: string
          description: The tag part of `image`, as `BridgeOfferingRequest.image_tag` takes it back.
        front_door:
          type:
          - string
          - 'null'
          description: The Matrix ID users message to get an instance (`per_user` only).
        access:
          $ref: '#/components/schemas/BridgeOfferingAccess'
        options:
          $ref: '#/components/schemas/BridgeOfferingOptions'
        instances:
          type: object
          description: Instance counts by state.
          additionalProperties:
            type: integer
        created_at:
          type: string
          format: date-time
        overlapping_appservices:
          type: array
          description: Bridges of this network registered by hand whose namespace covers this offering's instances, so a message for a ghost user reaches both. Empty once every such registration is removed (RFC 0017 section 6).
          items:
            $ref: '#/components/schemas/AppServiceOverlap'
    BridgeInstance:
      type: object
      required:
      - type
      - user_id
      - state
      properties:
        type:
          type: string
        user_id:
          type:
          - string
          - 'null'
          description: The owner; null for a shared type's instance.
        state:
          type: string
          enum:
          - requested
          - registered
          - deploying
          - starting
          - ready
          - failed
          - removing
        reason:
          type:
          - string
          - 'null'
          description: Why it failed, or what it is waiting for.
        appservice_id:
          type:
          - string
          - 'null'
        bot:
          type:
          - string
          - 'null'
          description: The instance's own bot, which the user talks to.
        deployment:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BridgeDeployment'
        health:
          type:
          - string
          - 'null'
          description: The registry's word for its ping health (`healthy`, `down`, ...).
        last_ping_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When this server last pinged the instance's bridge.
        last_error:
          type:
          - string
          - 'null'
          description: What went wrong, if the last ping failed.
        created_at:
          type: string
          format: date-time
        ready_at:
          type:
          - string
          - 'null'
          format: date-time
        chat_room:
          type:
          - string
          - 'null'
          description: The direct chat between the owner and the bot, once the manager has made it.
        chat_started_by:
          type:
          - string
          - 'null'
          enum:
          - owner
          - bot
          - null
          description: Who the bot is in that chat for. `owner` when the owner invited it, so the bridge takes bare commands there; `bot` when the bot started it and nobody could act as the owner, so commands there need the bridge's prefix (or a new chat the owner starts); null until the manager has settled it.
        device_name:
          type:
          - string
          - 'null'
          description: What the network's own device list (WhatsApp's Linked devices, Signal's, Telegram's Devices, Google Messages' paired devices) calls this bridge, as its config names it, such as `Myelin WhatsApp bridge for alice (example.org)`. Null for a kind of bridge whose network has no such setting. A link made before the name was set keeps its old name until the bridge is linked again.
        signed_bot_device:
          type:
          - string
          - 'null'
          description: The bot's device the manager has cross-signed with the bot's own self-signing key. The manager keeps the bot's cross-signing identity (master and self-signing keys, published as the appservice), so a client that excludes insecure devices (Element's "Exclude insecure devices", Element X's invisible crypto) still shares room keys with the bridge. Null until a device has been signed; a bridge with a reset database makes a new device, which is signed on a later step.
        last_key_withheld:
          oneOf:
          - $ref: '#/components/schemas/KeyWithheld'
          - type: 'null'
          description: The last time a client refused to share a room's keys with this instance's bridge (`m.room_key.withheld` delivered to its bot), from its appservice's health. The bridge answers the person in the chat that their message was not bridged; this says the same to the operator.
        removed_bot_devices:
          type: array
          items:
            $ref: '#/components/schemas/RemovedBotDevice'
          description: The bot's devices the manager removed because the bridge had moved on to a newer one, newest last; the last five. A bridge whose crypto store was reset makes a new device and leaves the old one registered, and clients go on encrypting room keys to it (and withholding keys from it). The manager removes a bot's device once another device of the bot with keys was seen in use after it and it has gone unseen for a day; the device in use is never removed.
    RemovedBotDevice:
      type: object
      required:
      - device_id
      - removed_at
      - kept_device
      properties:
        device_id:
          type: string
          description: The removed device.
        removed_at:
          type: string
          format: date-time
          description: When the manager removed it.
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the server had last seen the device in use (or made it), if it knew.
        kept_device:
          type: string
          description: The bot's device the bridge uses, which the manager kept.
    BridgeDeployment:
      type: object
      required:
      - namespace
      - name
      - phase
      - ready
      properties:
        namespace:
          type: string
        name:
          type: string
          description: 'The `Bridge` resource''s name, which its Deployment, Service and pods share (`bridge-whatsapp-alice-<replicaset>-<pod>`): `bridge-<short type>-<owner localpart>` (`bridge-whatsapp-alice`), or `bridge-<short type>` for a shared instance (`bridge-heisenbridge`), made a DNS-1123 label (lowercase, `[a-z0-9-]`, at most 46 characters) with `-<6 hex of sha256(appservice id)>` appended only where that changed or shortened the id. Decided when the instance is first named and kept until it is removed; an instance deployed before 2026-10-02 keeps its `bridge-<8 hex>` name. Its Secret is `<name>-files` and its volume claim `<name>-data`.'
        image:
          type: string
        service_url:
          type: string
        phase:
          type: string
          enum:
          - Pending
          - Ready
          - Degraded
        ready:
          type: boolean
        message:
          type:
          - string
          - 'null'
          description: What the operator last said (a pull failure, a crash loop, waiting for the pod).
    BridgeInstanceFiles:
      type: object
      properties:
        config_yaml:
          type:
          - string
          - 'null'
        registration_yaml:
          type: string
        compose_yaml:
          type: string
        manifest_yaml:
          type: string
          description: A Secret with the files and a `Bridge` resource, for a cluster running the Myelin operator.
    ClusterStatus:
      type: object
      properties:
        mode:
          type: string
        epoch:
          type: integer
        replica_count:
          type: integer
          description: How many replicas are registered and heartbeating, whatever their status (joining, active, draining or drained; a replica that has stopped heartbeating is not counted). A drained replica is counted, because it is still serving by forwarding. Without the replica registry, the number of replicas owning a shard. 1 for a single node.
        shard_count:
          type: integer
        heartbeat_seq:
          type: integer
          description: The sequence number of the answering replica's last heartbeat that
            reached the store, which every heartbeat increments (`hs_cluster_heartbeat_seq`).
            Absent for a single node.
        drain_released_at_once_count:
          type: integer
          description: How many times since the answering replica started a drain released
            every shard it owned at once rather than one lease at a time
            (`hs_cluster_drain_released_at_once_total`). Absent for a single node.
        search_rooms_behind:
          type: integer
          minimum: 0
          description: Rooms the answering replica owns whose newest events are not yet
            searchable there, which its search indexer's catch-up still has to read
            (`hs_room_search_rooms_behind`). The indexer runs on every replica over the rooms
            that replica owns, so this is the answering replica's number. 0 when search is up to
            date; a number that stays high means the indexer is stuck, and its log lines start
            with "search index". Set for a single node too. Absent until the indexer has counted
            once since the replica started.
        search_index_documents:
          type: integer
          minimum: 0
          description: Events the answering replica's room-event search index holds, as of its
            last write to it (`hs_room_search_index_documents`). Set for a single node too.
            Absent until the indexer has read the count once since the replica started.
    Replica:
      type: object
      description: One replica of the cluster, as the replica answering the request sees it. A server not running as a cluster is a cluster of one (`role` is `single-node`).
      required:
      - id
      - role
      - status
      - shard_count
      - epoch
      - this_replica
      properties:
        id:
          type: string
        role:
          type: string
          description: '`single-node` for the one replica of a server not running as a cluster, `replica` otherwise.'
        status:
          type: string
          description: '`joining`: heartbeating, not yet taking shards. `active`: serving and owning shards. `draining`: an administrator asked it to hand its shards to the other replicas (or it is shutting down), and it still owns some. `drained`: asked to drain, and it owns none; it keeps serving requests, forwarding each to the shard''s owner. A drained replica that is stopped stays listed, drained, until it is undrained, and comes back drained if it is started again. `unreachable`: its heartbeats stopped, and the others are taking its shards.'
          enum:
          - joining
          - active
          - draining
          - drained
          - unreachable
        shard_count:
          type: integer
          description: Shards this replica owns.
        epoch:
          type: integer
          description: The replica's generation, which changes each time it starts.
        this_replica:
          type: boolean
          description: Whether this is the replica that answered the request.
        mesh_addr:
          type:
          - string
          - 'null'
          description: '`host:port` of its mesh listener; null for a single node.'
        version:
          type:
          - string
          - 'null'
          description: Its server version, as it reported it.
        zone:
          type:
          - string
          - 'null'
          description: Its topology zone, when configured.
        last_heartbeat_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Its last heartbeat; null for a single node, which has none.
        heartbeat_seq:
          type: integer
          description: The sequence number of that heartbeat, which every heartbeat increments
            and the other replicas watch for liveness. Absent for a single node.
        drain_requested_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When an administrator asked it to drain; null unless it is draining or drained at an administrator's request. A drain request outlives a restart, so a drained replica comes back drained.
        drain_requested_by:
          type:
          - string
          - 'null'
          description: Who asked it to drain.
        drain_task_id:
          type:
          - string
          - 'null'
          description: The task following the drain (`GET /tasks/{id}`), which succeeds once the replica owns no shards.
    Shard:
      type: object
      description: One unit of ownership. Rooms, users, federation destinations and appservices are each hashed onto a fixed number of shards, and every shard has at most one owning replica.
      required:
      - kind
      - id
      - owner
      - state
      - epoch
      properties:
        kind:
          type: string
          enum:
          - room
          - user
          - federation
          - appservice
          - global
        id:
          type: string
          description: '`kind/index`, for example `room/3`.'
        owner:
          type:
          - string
          - 'null'
          description: The owning replica; null while nobody owns it.
        state:
          type: string
          enum:
          - owned
          - released
          - unassigned
          description: '`owned`; `released`, it had an owner and has none now (typically for a moment during a handoff); or `unassigned`, never owned.'
        epoch:
          type: integer
          description: The fencing epoch, which increases every time the shard changes owner.
    MigrationStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - idle
          - copying
          - paused
          - ready_for_cutover
          - cutting_over
          - verifying
          - completed
          - failed
          - aborted
        source:
          type:
          - string
          - 'null'
        streams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              copied_count:
                type: integer
              total_count:
                type:
                - integer
                - 'null'
              rate_per_second:
                type: number
              skipped_count:
                type: integer
                description: Rows deliberately not copied (hidden devices, rooms joined over federation, ...); each is in the log with why.
              failed_count:
                type: integer
                description: Rows that could not be copied; each is in the log with the error.
              done:
                type: boolean
                description: Every row of this stream has been read.
        estimated_remaining_ms:
          type:
          - integer
          - 'null'
        errors:
          type: array
          items:
            type: string
        task_id:
          type:
          - string
          - 'null'
          description: The task running the current step (copy, verification or cutover), if any.
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        started_by:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the cutover finished.
        cutover_by:
          type:
          - string
          - 'null'
        verification:
          description: The last verification's findings. Null until one has run.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MigrationVerification'
    MigrationVerification:
      type: object
      properties:
        passed:
          type: boolean
          description: Every count matches and no sample differs.
        checked_at:
          type: string
          format: date-time
        streams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              source_count:
                type: integer
                description: Rows in Synapse that are meant to be copied.
              target_count:
                type: integer
                description: Of those, how many are here.
              skipped_count:
                type: integer
              sampled:
                type: integer
                description: Rows compared field by field.
              mismatches:
                type: array
                items:
                  type: string
    MigrationLogEntry:
      type: object
      properties:
        recorded_at:
          type: string
          format: date-time
        stream:
          type: string
        message:
          type: string
        level:
          type: string
          enum:
          - info
          - warning
          - error
    MigrationStartRequest:
      type: object
      properties:
        source_secret_ref:
          type: string
          description: A reference to a configured secret; the connection string itself is never in the API. It is a JSON Pointer into the configuration holding a Synapse source (the `migration` section, set with config.update); `/migration/synapse` when absent.
    ConfigSection:
      type: object
      properties:
        name:
          type: string
        reloadable:
          type: boolean
          description: Whether this section can change on a running server without a restart.
        bootstrap:
          type: boolean
          description: Whether this whole section is bootstrap (decision 0010) -- read before the database is open or belonging to one process, and so never stored in it (storage, listeners). Read-only; config.update refuses it with 409. Sections holding only some bootstrap settings mark them per setting (ConfigSettingInfo.bootstrap).
        source:
          type: string
          description: 'The highest-precedence layer that sets anything in this section: default, file, database or environment.'
        last_reloaded_at:
          type:
          - string
          - 'null'
          format: date-time
        values:
          type: object
          description: 'The section''s effective values, keyed relative to the section. Secrets rendered as {"$secret": true}. A patch may set a secret; echoing the placeholder back means "leave it alone". Inside a list, which a merge patch replaces whole, an echoed placeholder is put back from the value stored at the same pointer, or from the pointer its $from member names ({"$secret": true, "$from": "/auth/oidc_providers/1/client_secret"}), which survives entries being moved or removed; a $from naming nothing stored is a 400 on that pointer (RFC 0020).'
        origins:
          type: object
          description: 'Which layer set each setting, keyed by whole-configuration JSON Pointer (/auth/enable_registration) so it matches ConfigSchema.settings. Every setting is listed, including those at their schema default.'
          additionalProperties:
            type: string
            enum:
            - default
            - file
            - database
            - environment
        revision:
          type: integer
          description: The configuration's revision, which is also this section's ETag for If-Match. It counts writes to the configuration as a whole, not to this section.
        history:
          type: array
          description: The most recent changes to this section, newest first. Returned by config.get; omitted by config.list.
          items:
            $ref: '#/components/schemas/ConfigChange'
        applied:
          $ref: '#/components/schemas/ConfigReloadReport'
          description: 'Only on the answer to config.update or config.history.revert: what the write did to the running server -- the sections it hot-applied (reloaded_sections) and those whose change waits for a restart (requires_restart), as config.reload reports them. Absent on reads.'
    ConfigChange:
      type: object
      properties:
        revision:
          type: integer
        section:
          type: string
        patch:
          type: object
          description: 'The RFC 7396 merge patch that was applied; null members are resets to the schema default. Secrets rendered as {"$secret": true}.'
        actor:
          type:
          - string
          - 'null'
        at:
          type: string
          format: date-time
        settings:
          type: array
          description: One row per setting the change touched, in the patch's order.
          items:
            $ref: '#/components/schemas/ConfigSettingChange'
        reverts:
          type:
          - integer
          - 'null'
          description: The revision this change reverted (config.history.revert). Absent when it was not a revert.
        revertible:
          type: boolean
          description: Whether config.history.revert can undo it -- the server knows what it replaced (changes recorded before it kept that cannot be) and it wrote no bootstrap setting. Whether a later change stands in the way is only known when the revert is asked for.
    ConfigSettingChange:
      type: object
      required:
      - pointer
      - path
      - secret
      - from
      - to
      properties:
        pointer:
          type: string
          description: Whole-configuration JSON Pointer (/rate_limits/login/per_second), as in ConfigSection.origins.
        path:
          type: string
          description: The same setting as a dotted path (rate_limits.login.per_second).
        secret:
          type: boolean
          description: 'Whether the value is, or holds, a secret. Both sides are then {"$secret": true}, never the secret.'
        from:
          description: What the database held before the change; null when the change was recorded before this server kept prior values.
          oneOf:
          - $ref: '#/components/schemas/ConfigSettingValue'
          - type: 'null'
        to:
          $ref: '#/components/schemas/ConfigSettingValue'
    ConfigSettingValue:
      type: object
      required:
      - set
      properties:
        set:
          type: boolean
          description: Whether the database held a value. False means the setting read from the bootstrap file or the schema default (which is not recorded, since the file can change underneath the history).
        value:
          description: 'The value, when set. Secrets as {"$secret": true}.'
    ConfigChangePage:
      allOf:
      - $ref: '#/components/schemas/PageEnvelope'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ConfigChange'
    ConfigRevertRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Revert even though later changes wrote some of the same settings, undoing them too.
    ConfigSchema:
      type: object
      properties:
        schema:
          type: object
          description: The JSON Schema of the whole configuration, derived from the server's own configuration type.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSectionInfo'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSettingInfo'
        revision:
          type: integer
    ConfigSectionInfo:
      type: object
      properties:
        name:
          type: string
        reloadable:
          type: boolean
        bootstrap:
          type: boolean
        source:
          type: string
    ConfigSettingInfo:
      type: object
      properties:
        pointer:
          type: string
          description: A whole-configuration JSON Pointer (/auth/enable_registration). An array is one setting, not one per element.
        section:
          type: string
        origin:
          type: string
          enum:
          - default
          - file
          - database
          - environment
        secret:
          type: boolean
          description: Whether this setting's value is served redacted.
        reloadable:
          type: boolean
          description: Whether a change to it takes effect without a restart (applies is hot).
        applies:
          type: string
          enum:
          - bootstrap
          - hot
          - restart
          description: 'When a change to it takes effect: bootstrap (set at install in the bootstrap file, HS__ variables or Helm values, never stored), hot (applied to the running server at once) or restart (stored at once, read at the next start). The same classification the schema member carries as x-applies on each setting (decision 0016).'
        editable:
          type: boolean
          description: Whether config.update would accept a change to it. False for a bootstrap setting and for anything an HS__ environment variable pins, so the interface can show the field read-only with a reason rather than offering an edit that would be refused.
        bootstrap:
          type: boolean
          description: Whether this is a bootstrap setting (decision 0010) -- where the database is, a listener, this replica's cluster identity, a local path, the server name, or registration files imported once. Set at install in the bootstrap file, an HS__ environment variable or the Helm values, and never stored in the database; the reason editable is false, when it is.
    ConfigValidateReport:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        requires_restart:
          type: array
          description: Sections whose new value could not be applied without restarting the process.
          items:
            type: string
    ConfigReloadReport:
      type: object
      properties:
        reloaded_sections:
          type: array
          description: Sections in which a changed setting was applied to the running server, now. A section whose change needed nothing re-read is not listed.
          items:
            type: string
        errors:
          type: array
          description: Sections whose change could not be applied although they are reloadable, one error per section at its pointer (/rate_limits); the old value stays in force.
          items:
            $ref: '#/components/schemas/ValidationError'
        requires_restart:
          type: array
          description: Sections holding a setting that differs from what this process started on and that is only read at startup. Reported rather than swallowed. A section can be listed here and in reloaded_sections when settings of both kinds changed.
          items:
            type: string
        revision:
          type: integer
    StatisticsOverview:
      type: object
      properties:
        users_count:
          type: integer
        rooms_count:
          type: integer
        media_count:
          type: integer
