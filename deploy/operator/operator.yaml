# The operator run on its own, for `Homeserver` resources: `hs operator --homeservers`, the
# server's own image, one replica, watching the namespace it runs in. It also runs the `Bridge`
# controller, as the chart's bridge operator does; do not run both in one namespace.
#
# Install (the namespace comes from kustomization.yaml; change it there or with `kustomize edit
# set namespace`):
#
#   kubectl apply -f deploy/crds/homeserver.yaml -f deploy/crds/bridge.yaml
#   kubectl apply -k deploy/operator
#
# Then a `Homeserver` in the same namespace (examples/ has two). docs/crds/homeserver.md is the
# resource's reference.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myelin-operator
  labels:
    app.kubernetes.io/name: myelin-operator
    app.kubernetes.io/component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: myelin-operator
  labels:
    app.kubernetes.io/name: myelin-operator
    app.kubernetes.io/component: operator
rules:
  - apiGroups: ["hs.matrix.org"]
    resources: ["homeservers", "homeservers/status", "bridges", "bridges/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # What a Homeserver becomes.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Pods are read (readiness, revision), never written: the StatefulSet controller replaces them.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The admin API token (spec.adminApi.tokenSecretRef) and bridge files.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: myelin-operator
  labels:
    app.kubernetes.io/name: myelin-operator
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: myelin-operator
subjects:
  - kind: ServiceAccount
    name: myelin-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myelin-operator
  labels:
    app.kubernetes.io/name: myelin-operator
    app.kubernetes.io/component: operator
spec:
  # One controller at a time: two would race each other's status writes and drains.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: myelin-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myelin-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: myelin-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/brandon-dacrib/myelin:main
          imagePullPolicy: Always
          args: ["operator", "--homeservers", "--metrics-address", "0.0.0.0:9090"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myelin-operator-metrics
  labels:
    app.kubernetes.io/name: myelin-operator
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: myelin-operator
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
