name: ci

on: [push, pull_request]

# Cancel superseded runs on the same ref so the shared amd64/arm64 runner pool (and the shared
# target/ this project's contributors are warned to be careful with locally) is not doing
# redundant work for a branch that already has a newer push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast and loud rather than silently retrying/backing off, matching the workspace's own
  # "do not move on with failing checks" convention (docs/workstreams/12-platform-and-kubernetes.md
  # agent instructions).
  CARGO_NET_RETRY: 2

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.arch }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.arch }}
      # hs-operator compares the `Homeserver` reconciler's objects with `helm template` of
      # deploy/helm/hs; HS_REQUIRE_HELM makes that test fail, rather than skip, without helm.
      - uses: azure/setup-helm@v4
      - run: cargo test --workspace --all-targets
        env:
          HS_REQUIRE_HELM: "1"
      - run: cargo test --workspace --doc

  # cargo-audit rather than cargo-deny: it checks Cargo.lock against the RustSec advisory
  # database with no extra config file needed. A cargo-deny pass (license/bans/sources policy)
  # is a reasonable follow-up once this track has somewhere in its own ownership
  # (crates/hs-telemetry, crates/hs-operator, .github/, deploy/) to put a deny.toml without
  # reaching into repo-root territory another track might also want to configure.
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    # `rustsec/audit-check` reports by creating a check run, which needs this. Without it the job
    # fails with "Resource not accessible by integration" *after* auditing successfully — the
    # advisory scan passes, the publishing of its result is what breaks, which reads like a
    # security failure and is not one.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The management interface: lint, types, unit tests and the production build (`npm run
  # check`), then the mock-backed Playwright suite (`npm run test:e2e`, MSW in the browser, no
  # homeserver). These were run only by hand until 2026-09-30, and two of the browser flows once
  # failed for an unknown length of time before anybody noticed (docs/next-steps.md, known gaps).
  # The Chromium the suite needs is installed with its system dependencies; the report is kept
  # for a failed run only, so a green run uploads nothing.
  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Every cargo-fuzz target (crates/hs-federation/fuzz, crates/hs-media/fuzz) built on nightly and
  # run for 60 s each from its checked-in seed corpus (tests/fuzz/run_all.sh; status 14 has the
  # 10-minute baseline). Deliberately not in `ci-ok`'s needs: a nightly toolchain can break the
  # build for reasons that are not this repository's, and a minute of random inputs is not a
  # deterministic gate. It still fails red (no `continue-on-error`), and a crash's input is
  # uploaded, so a finding is seen on the commit that exposed it.
  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/hs-federation/fuzz
            crates/hs-media/fuzz
      - run: tests/fuzz/run_all.sh 60
        env:
          FUZZ_OUT: ${{ runner.temp }}/fuzz-runs
          FUZZ_REQUIRE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: |
            crates/*/fuzz/artifacts/
            ${{ runner.temp }}/fuzz-runs/**/fuzz.log
          retention-days: 14

  # A single job that must pass for a PR to merge, independent of how the matrix jobs above are
  # split or renamed later (a GitHub required-status-check list has to name jobs individually
  # otherwise, which silently stops blocking merges when a job is renamed or the matrix changes).
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    needs: [fmt, clippy, test, audit, web]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          for result in "${{ needs.fmt.result }}" "${{ needs.clippy.result }}" "${{ needs.test.result }}" "${{ needs.audit.result }}" "${{ needs.web.result }}"; do
            if [ "$result" != "success" ]; then
              echo "a required job did not succeed: $result"
              exit 1
            fi
          done
