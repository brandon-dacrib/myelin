[package]
name = "hs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The `hs` binary: serve, single-node, import, appservice, cluster and compat subcommands"

[[bin]]
name = "hs"
path = "src/main.rs"

[lib]
name = "hs_cli"
path = "src/lib.rs"

[dependencies]
hs-config = { path = "../hs-config" }
hs-cluster = { path = "../hs-cluster" }
hs-compat = { path = "../hs-compat" }
hs-auth = { path = "../hs-auth" }
hs-kv = { path = "../hs-kv" }
hs-tables = { path = "../hs-tables" }
bytes = { workspace = true }
hs-telemetry = { path = "../hs-telemetry" }
prometheus-client = { workspace = true }
hs-http = { path = "../hs-http" }
hs-room = { path = "../hs-room" }
hs-federation = { path = "../hs-federation" }
hs-user = { path = "../hs-user" }
hs-e2e = { path = "../hs-e2e" }
hs-push = { path = "../hs-push" }
hs-media = { path = "../hs-media" }
hs-appservice = { path = "../hs-appservice" }
hs-bridges = { path = "../hs-bridges" }
hs-admin = { path = "../hs-admin" }
hs-model = { path = "../hs-model" }
# `hs operator`: the Bridge controller (docs/rfcs/0017).
hs-operator = { path = "../hs-operator" }
object_store = { workspace = true }

async-trait = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand_core = { workspace = true }
rpassword = { workspace = true }
reqwest = { workspace = true }
ruma = { workspace = true }
# `hs admin-token create --expires-in`: an instant as RFC 3339 (`src/admin_tokens.rs`).
time = { workspace = true }
# A listener with `tls:` is served as HTTPS by the server itself (`src/tls_listener.rs`): the
# PEM chain and key are read with `rustls-pemfile`, the handshake runs on `tokio-rustls`.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `tests/outbound_ipv6_only_peer.rs` captures the server's log to check the warning an operator
# sees when the outbound address policy hides a peer's only working address.
tracing-subscriber = { workspace = true }
# `tests/cluster_admin.rs`: two real `hs serve` processes on one PostgreSQL need a database of
# their own per run, made and dropped with a plain client.
postgres = { workspace = true }
# The fake federation peer `tests/federation_sender.rs` sends real transactions to; the same
# double `hs-federation`'s own client and sender tests use.
hs-testkit = { path = "../hs-testkit" }
# `tests/federation_restart.rs` and `tests/tls_listener.rs`: `rcgen` mints a private CA and
# leaf certificates for 127.0.0.1 (the TLS crates above serve the proxy and the listener).
rcgen = { workspace = true }
