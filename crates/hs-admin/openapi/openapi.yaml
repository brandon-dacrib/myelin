      - name: sort
        in: query
        description: One of `server_name`, `failing_since`, `last_successful_at`,
          `retry_last_at`, `pending_pdu_count`, `pending_edu_count`, with `-` in front for
          descending; a destination without the timestamp sorts last either way. Absent means
