        - admin:read
      parameters:
      - name: recorded_after
        in: query
        schema:
          type: string
          format: date-time
      - name: recorded_before
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: NDJSON stream, one AuditEntry per line.
