    RegistrationToken:
      type: object
      description: A token that lets someone register an account, even while open registration
        is off. `pending` counts registrations that have presented the token and not finished
        yet; `completed` counts accounts created with it. A token is `valid` while it has not
        expired and `pending + completed` is below `uses_allowed` (no limit when null).
      required:
      - token
      - valid
      - uses_allowed
      - pending
      - completed
      - expires_at
      - created_at
      properties:
        token:
          type: string
        valid:
          type: boolean
          description: Whether the token would admit a new registration right now.
        uses_allowed:
          type:
          - integer
          - 'null'
        pending:
          type: integer
        completed:
          type: integer
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    RegistrationTokenCreate:
      type: object
      properties:
        token:
          type: string
          description: The token to create. Omit it to have the server generate one of
            `length` characters. At most 64 characters from `A-Z a-z 0-9 . _ ~ -`.
          maxLength: 64
          pattern: ^[A-Za-z0-9._~-]+$
        uses_allowed:
          type:
          - integer
          - 'null'
          minimum: 0
          description: How many accounts the token may create; null or absent for no limit.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the token stops working; null or absent for never.
        length:
          type: integer
          minimum: 1
          maximum: 64
          description: The length of a generated token, 16 when absent. Ignored when `token` is
            given.
    RegistrationTokenUpdate:
      type: object
      properties:
        uses_allowed:
          type:
          - integer
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
