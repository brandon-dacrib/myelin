# This is the OpenAPI 3.1 contract for RFC 0004 (docs/rfcs/0004-admin-api.md), the admin API
# under /api/v1. It was produced by a throwaway Python generator script (not checked into this
# repository; see docs/status/15-admin-api-and-modules.md, "Decisions made") to keep ~120 paths'
# pagination envelopes, error responses and scopes consistent. From here on, hand-edit this file
# (and its companion crates/hs-admin/openapi/operations.json, the Rust-consumable operation table
# `hs-admin`'s router is built from) directly; keep the two in sync by hand, since the generator
# no longer exists. `cargo test -p hs-admin --test contract` and `npx @redocly/cli lint` catch
# drift between this file, operations.json, and the router.
openapi: 3.1.0
info:
  title: hs-admin API
  summary: The native administration and moderation API for the homeserver.
  version: 0.1.14
  description: 'The only API the management interface (track 16) talks to. See docs/rfcs/0004-admin-api.md for the full design rationale: resource modeling, naming, pagination, filtering, errors, idempotency, scopes, versioning and the event stream. This document is the contract; the hs-admin router''s contract tests assert the router and this document agree on paths and methods (RFC 0004 section 1, decision D15.16).'
  contact:
    name: 'Track 15: Admin API and modules'
    url: https://github.com/example/matrix-reimplement/blob/main/docs/workstreams/15-admin-api-and-modules.md
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-hs-contract: 1.0-draft
  x-hs-changelog:
  - version: 0.1.0
    date: '2026-09-18'
    notes: Initial draft covering every resource in RFC 0004 section 4. Not yet frozen; freezes at week 8 as contract 1.0.
  - version: 0.1.1
    date: '2026-10-02'
    notes: 'Documentation: BridgeDeployment.name says how a bridge''s Kubernetes objects are
      named (bridge-<short type>-<owner localpart>, or bridge-<short type> for a shared
      instance, a DNS-1123 label of at most 46 characters) and that an instance deployed
      before 2026-10-02 keeps its bridge-<8 hex> name.'
  - version: 0.1.2
    date: '2026-10-02'
    notes: 'Additive: users.deactivate takes erase (deactivate, leave every room, then remove
      the password, tokens, devices and keys, 3PIDs, external ids, profile and features for
      good); User.erased and erased_at_ms; users.reactivate and users.reset_password answer
      409 for an erased account; the event stream carries user.erased.'
  - version: 0.1.3
    date: '2026-10-02'
    notes: 'Additive: /admin-tokens (list, create, get, delete) mints admin API tokens that carry
      a chosen subset of the scopes (RFC 0004 section 8.1, service_account principals). A token
      lacking an operation''s scope gets 403 insufficient-scope naming the scope, as before.'
  - version: 0.1.4
    date: '2026-10-02'
    notes: 'Additive: GET /federation/destinations honours sort (server_name, failing_since,
      last_successful_at, retry_last_at, pending_pdu_count, pending_edu_count; - for
      descending) and documents its default order and paging; Replica.heartbeat_seq;
      ClusterStatus.heartbeat_seq and .drain_released_at_once_count.'
  - version: 0.1.5
    date: '2026-10-02'
    notes: 'Additive: BridgeInstance.chat_room and chat_started_by (owner or bot) say which
      direct chat a person has with their bridge''s bot and who opened it; BridgeType.command_prefix
      is the prefix the bridge''s bot takes commands with outside its management room.'
  - version: 0.1.6
    date: '2026-10-02'
    notes: 'Additive: BridgeInstance.device_name, the name the bridge presents to its network
      as a linked device (Myelin <Network> bridge for <localpart> (<server>), or without the
      person for a shared instance); a network that has no such setting has none.'
  - version: 0.1.7
    date: '2026-10-03'
    notes: 'Additive: BridgeInstance.signed_bot_device (the bridge manager cross-signs each
      bridge bot''s device, decision 0027); last_key_withheld on bridge instances and on
      appservice health, the last time a client withheld a room key from the bot. (Entry
      written 2026-10-04; the bump had none.)'
  - version: 0.1.8
    date: '2026-10-04'
    notes: 'Additive: AppServiceHealth.overlaps_offering (schema OfferingOverlap), set on a
      bridge registered by hand for a network this server now offers, saying which offering and
      what to do; BridgeOffering.overlapping_appservices (schema AppServiceOverlap), the same
      registrations seen from the offering. BridgeType.command_prefix is now set for Signal,
      Slack, X and LinkedIn (!signal, !slack, !twitter, !linkedin: mautrix-go''s fallback of
      ! and the network id).'
  - version: 0.1.9
    date: '2026-10-04'
    notes: 'users.update applies display_name, avatar_url and user_type for real (they were
      refused with 400 naming the field): a name or avatar change takes the path the user''s own
      PUT /profile does, so their m.room.member event is re-sent in every joined room and other
      servers see it; UserUpdate.display_name and avatar_url accept null (clear), as user_type
      did; user_type is bot, support or null, on users.create too. users.availability answers
      for real, and refuses a localpart that could never be a username with 400 naming
      param:localpart and the reason.'
  - version: 0.1.10
    date: '2026-10-04'
    notes: 'Additive: ClusterStatus.search_rooms_behind (rooms the answering replica owns whose
      newest events its room-event search index does not hold yet, hs_room_search_rooms_behind;
      0 when search is up to date) and ClusterStatus.search_index_documents (events that index
      holds, hs_room_search_index_documents). Both are set for a single node too, and absent
      until the indexer has counted once since the replica started.'
  - version: 0.1.11
    date: '2026-10-08'
    notes: 'Additive: AppService.queue (schema AppServiceQueue): how many transactions wait to
      be sent to the appservice, how many were dead-lettered, and how long the oldest waiting
      one has waited, on every row of appservices.list, so a list shows which bridge is falling
      behind without a request per bridge. The same numbers as the hs_appservice_queue_* gauges.'
  - version: 0.1.12
    date: '2026-10-08'
    notes: 'Additive: users.rate_limit.get answers UserRateLimit, the override as before plus
      server_wide (schema ServerRateLimits: rate_limits.enabled, .message and .admin_redaction
      as the server runs them), the limits the override replaces and that apply once it is
      cleared; absent when the configuration cannot be read. config.update and config.validate
      refuse a setting removed from the configuration schema with 400 naming it and why
      (decision 0034).'
  - version: 0.1.13
    date: '2026-10-10'
    notes: 'Additive: BridgeInstance.removed_bot_devices (schema RemovedBotDevice), the bot
      devices the bridge manager removed because the bridge had moved on to a newer one (a
      reset crypto store leaves the old device registered).'
  - version: 0.1.14
    date: '2026-10-10'
    notes: 'Additive: federation.destinations.forget (DELETE /federation/destinations/{server_name},
      409 while a room is shared unless force=true) drops a destination''s queue, backoff,
      catch-up mark and cached keys; federation.destinations.prune (POST
      /federation/destinations/prune, dry_run) forgets every destination sharing no room with
      nothing queued and, with failing_for, every one failing that long whose queue is only for
      rooms this server left, answering DestinationPruneReport; Destination.shared_rooms_count
      and the list''s shares_room filter (decision 0042).'
servers:
- url: /api/v1
  description: Same origin as /_matrix on the client listener.
tags:
- name: Server
  description: Server identity, health and the caller's own principal.
- name: Setup
  description: Creating the first administrator on a server that has none.
- name: Recovery
  description: Getting an administrator back into a server nobody can sign in to, with a link issued to whoever holds the server's signing key.
- name: Users
  description: Users, devices, sessions and their moderation actions.
- name: Rooms
  description: Rooms, their state, timeline and moderation actions.
- name: Media
  description: Media metadata, quarantine and bulk cleanup.
- name: Federation
  description: Federation destinations and signing keys.
- name: Reports
  description: Event and user reports (one inbox, kind discriminated).
- name: RegistrationTokens
  description: Registration token management.
- name: AdminTokens
  description: Admin API tokens narrower than a full administrator's, minted with the scopes
    their holder needs.
- name: Tasks
  description: Long-running operations.
- name: Statistics
  description: Dashboard and time-series statistics.
- name: ServerNotices
  description: Sending and listing server notices.
- name: Bridges
  description: Appservices (11's registry) and the bridge-type catalog.
- name: Cluster
  description: Cluster (03) replica and shard status.
- name: Migration
  description: Migration from Synapse (13).
- name: Config
  description: Reloadable configuration (13).
- name: AuditLog
  description: The immutable audit log.
- name: Events
  description: The server-sent-events stream.
security:
- OAuth2: []
paths:
  /appservices:
    get:
      summary: List appservices
      operationId: appservices.list
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: A page of appservices, with health summaries inline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServicePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      summary: Create (register) an appservice
      operationId: appservices.create
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - name: dry_run
        in: query
        schema:
          type: boolean
          default: false
        description: Validate and return the parsed registration and namespace conflicts without creating anything.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppServiceCreate'
      responses:
        '201':
          description: The created appservice; live immediately (hot registration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /appservices/{id}:
    get:
      summary: Get an appservice
      operationId: appservices.get
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '200':
          description: The appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      summary: Update an appservice
      operationId: appservices.update
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppServiceUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      summary: Remove an appservice
      operationId: appservices.delete
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/backlog:
    get:
      summary: List pending and dead-lettered transactions
      operationId: appservices.backlog
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      responses:
        '200':
          description: A page of backlog entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServiceBacklogEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidCursor'
  /appservices/{id}/health:
    get:
      summary: Get an appservice's health
      operationId: appservices.health
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '200':
          description: Health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServiceHealth'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/logins:
    get:
      summary: Who has signed in to a bridge, and as what
      description: >-
        Asks the bridge's own provisioning API who has signed in (a mautrix bridgev2 bridge's
        `/_matrix/provision/v3/whoami`, with the shared secret a catalogue render mints and keeps
        in the registration's `io.myelin.provisioning_secret`). Answers are kept for 30 seconds
        per bridge and user. A bridge type with no such API answers `200` with `supported: false`
        and a `reason`; a bridge that could not be asked answers `200` with `error` set. A read,
        so not audited.
      operationId: appservices.logins
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:read
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - name: user_id
        in: query
        required: false
        description: The Matrix user to ask about. Optional for a per-user bridge instance, whose owner is asked about; required for a shared bridge whose type reports sign-ins.
        schema:
          type: string
      responses:
        '200':
          description: What the bridge says, or why it cannot be asked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeLogins'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/pause:
    post:
      summary: Pause an appservice
      operationId: appservices.pause
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The updated appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/ping:
    post:
      summary: Ping an appservice
      operationId: appservices.ping
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The updated appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/registration:
    get:
      summary: Export an appservice's registration (includes tokens)
      operationId: appservices.registration
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      responses:
        '200':
          description: The registration.
          content:
            application/json:
              schema:
                type: object
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/replay:
    post:
      summary: Replay pending or dead-lettered transactions (Task)
      operationId: appservices.replay
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppServiceReplayRequest'
      responses:
        '202':
          description: Accepted; a Task tracks progress.
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/tasks/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /appservices/{id}/resume:
    post:
      summary: Resume a paused appservice
      operationId: appservices.resume
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The updated appservice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /appservices/{id}/rotate-tokens:
    post:
      summary: Rotate an appservice's tokens
      operationId: appservices.rotate_tokens
      tags:
      - Bridges
      security:
      - OAuth2:
        - bridges:write
      parameters:
      - $ref: '#/components/parameters/AppserviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new tokens, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppServiceTokens'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /audit-log:
    get:
      summary: List audit entries
      operationId: audit_log.list
      tags:
      - AuditLog
      security:
      - OAuth2:
        - admin:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      - name: actor
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: target_type
        in: query
        schema:
          type: string
      - name: target_id
        in: query
        schema:
          type: string
      - name: outcome
        in: query
        schema:
          type: string
          enum:
          - success
          - failure
      - name: recorded_after
        in: query
        schema:
          type: string
          format: date-time
      - name: recorded_before
        in: query
        schema:
          type: string
          format: date-time
