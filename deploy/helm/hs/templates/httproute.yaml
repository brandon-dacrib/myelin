{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hs.fullname" . }}-client
  labels:
    {{- include "hs.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.gatewayName }}
      {{- if .Values.gatewayApi.gatewayNamespace }}
      namespace: {{ .Values.gatewayApi.gatewayNamespace }}
      {{- end }}
  {{- with .Values.gatewayApi.clientHostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /.well-known/matrix
      backendRefs:
        - name: {{ include "hs.fullname" . }}
          port: {{ .Values.service.clientPort }}
---
{{- if .Values.gatewayApi.federationHostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hs.fullname" . }}-federation
  labels:
    {{- include "hs.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.gatewayName }}
      {{- if .Values.gatewayApi.gatewayNamespace }}
      namespace: {{ .Values.gatewayApi.gatewayNamespace }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.gatewayApi.federationHostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/federation
        - path:
            type: PathPrefix
            value: /_matrix/key
      backendRefs:
        - name: {{ include "hs.fullname" . }}
          port: {{ .Values.service.federationPort }}
{{- end }}
{{- end }}
