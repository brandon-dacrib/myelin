[package]
name = "hs-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "hs-kv: ordered, transactional key-value abstraction. Track 01 (docs/workstreams/01-storage-engine.md)."

[[bench]]
name = "kv_bench"
harness = false

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
fjall = { workspace = true }
tracing = { workspace = true }
postgres = { workspace = true }
r2d2 = { workspace = true }
r2d2_postgres = { workspace = true }
# TLS for the PostgreSQL backend (`src/postgres_tls.rs`): the workspace's `rustls` stack, the
# same one `hs-cluster`'s mesh and `hs-federation`'s client use. `tokio` only for the
# `AsyncRead`/`AsyncWrite` traits the `postgres` crate's TLS adapter is written against; this
# crate still runs no runtime of its own (see `src/postgres_backend.rs`, "Execution model").
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
