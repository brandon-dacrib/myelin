          $ref: '#/components/responses/UnsupportedMediaType'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: Tokens issued by 07's OAuth 2.0 issuer (authorization code with PKCE for operators, client credentials for automation). A legacy Matrix access token of a user with the server-administrator flag is also accepted and is treated as admin:read plus admin:write.
      flows:
        authorizationCode:
          authorizationUrl: https://example.org/_matrix/client/oauth2/authorize
          tokenUrl: https://example.org/_matrix/client/oauth2/token
          scopes:
            admin:read: Read every resource, including the audit log, configuration (secrets redacted), cluster and migration status. Satisfies every other :read scope.
            admin:write: Everything. Implies every other scope.
            bridges:read: Read appservices, bridge types, their health and backlog, and appservice tasks and events.
            bridges:write: bridges:read plus create, update, delete, pause, resume, replay, rotate tokens, export registrations, render bridge types.
            moderation:read: Read users, rooms, reports, media, their sub-resources, moderation tasks and events. Sessions' IP addresses and account data are redacted. Not message content (a room's timeline and its events), which needs admin:read (decision 0013).
            moderation:write: moderation:read plus suspend, lock, shadow-ban, deactivate, redact, reset password, logout, room block/delete/purge, quarantine and delete media, resolve reports, server notices.
        clientCredentials:
          tokenUrl: https://example.org/_matrix/client/oauth2/token
          scopes:
            admin:read: Read every resource, including the audit log, configuration (secrets redacted), cluster and migration status. Satisfies every other :read scope.
            admin:write: Everything. Implies every other scope.
            bridges:read: Read appservices, bridge types, their health and backlog, and appservice tasks and events.
            bridges:write: bridges:read plus create, update, delete, pause, resume, replay, rotate tokens, export registrations, render bridge types.
            moderation:read: Read users, rooms, reports, media, their sub-resources, moderation tasks and events. Sessions' IP addresses and account data are redacted. Not message content (a room's timeline and its events), which needs admin:read (decision 0013).
            moderation:write: moderation:read plus suspend, lock, shadow-ban, deactivate, redact, reset password, logout, room block/delete/purge, quarantine and delete media, resolve reports, server notices.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size. Values above the resource's max are clamped, not rejected.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous page's next_cursor or prev_cursor.
      required: false
      schema:
        type: string
    IncludeTotal:
      name: include_total
      in: query
      description: Ask for the total count. Only honoured where a count is cheap; otherwise total is omitted.
      required: false
      schema:
        type: boolean
        default: false
    Q:
      name: q
      in: query
      description: Free-text search; semantics are per-resource.
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Sort field from the resource's allow-list. Prefix with - for descending.
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1-255 visible ASCII characters. Replays return the stored response for 24 hours.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      description: Compare-and-set precondition against the resource's current ETag.
      required: false
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      description: Resume the event stream after this id. Also accepted as ?last_event_id= for EventSource clients that cannot set headers.
      required: false
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      description: A Matrix user id, percent-encoded.
      required: true
      schema:
        type: string
      example: '%40alice%3Aexample.org'
    RoomId:
      name: room_id
      in: path
      description: A Matrix room id, percent-encoded.
      required: true
      schema:
        type: string
      example: '%21abc%3Aexample.org'
    EventId:
      name: event_id
      in: path
      description: A Matrix event id, percent-encoded.
      required: true
      schema:
        type: string
    DeviceId:
      name: device_id
      in: path
      description: A device id.
      required: true
      schema:
        type: string
    ServerName:
      name: server_name
      in: path
      description: A server name (federation destination).
      required: true
      schema:
        type: string
    MediaId:
      name: media_id
      in: path
      description: A media id local to server_name.
      required: true
      schema:
        type: string
    AppserviceId:
      name: id
      in: path
      description: An appservice id.
      required: true
      schema:
        type: string
    BridgeInstanceUser:
      name: user_id
      in: path
      description: The Matrix user the instance belongs to (`@alice:example.org`, URL-encoded), or `_` for a shared type's one instance.
      required: true
      schema:
        type: string
    RemoveInstances:
      name: remove_instances
      in: query
      required: false
      schema:
        type: boolean
    BridgeTypeId:
      name: type
      in: path
      description: A bridge type catalog id.
      required: true
      schema:
        type: string
    ReportId:
      name: id
      in: path
      description: A report id (ULID).
      required: true
      schema:
        type: string
    TaskId:
      name: id
      in: path
      description: A task id (ULID).
      required: true
      schema:
        type: string
    TokenId:
      name: token
      in: path
      description: A registration token's literal token string.
      required: true
      schema:
        type: string
    ReplicaId:
      name: id
      in: path
      description: A cluster replica id.
      required: true
      schema:
        type: string
    SectionName:
      name: section
      in: path
      description: A configuration section name.
      required: true
      schema:
        type: string
    AuditEntryId:
      name: id
      in: path
      description: An audit entry id (ULID).
      required: true
      schema:
        type: string
  responses:
    ValidationFailed:
      description: Malformed JSON, schema violation, or bad parameter (urn:hs:problem:validation-failed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCursor:
      description: The cursor is unparsable or its fingerprint does not match the current sort and filters (urn:hs:problem:invalid-cursor).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing, expired, revoked or malformed token (urn:hs:problem:unauthenticated).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="hs-admin", error="invalid_token"
    InsufficientScope:
      description: The token lacks the operation's required scope (urn:hs:problem:insufficient-scope).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer error="insufficient_scope", scope="..."
    Forbidden:
      description: Authenticated and scoped but the action is refused (urn:hs:problem:forbidden).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Unknown path or resource (urn:hs:problem:not-found).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate identifier, namespace conflict, or state conflict (urn:hs:problem:conflict).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyInFlight:
      description: The same Idempotency-Key is being processed concurrently (urn:hs:problem:idempotency-key-in-flight).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match did not match the resource's current ETag (urn:hs:problem:precondition-failed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured size limit (urn:hs:problem:payload-too-large).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: A body was sent with a Content-Type other than application/json (urn:hs:problem:unsupported-media-type).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyMismatch:
      description: The Idempotency-Key was reused with a different request (urn:hs:problem:idempotency-key-payload-mismatch).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Well-formed but semantically impossible request (urn:hs:problem:unprocessable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests (urn:hs:problem:rate-limited).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds.
    Internal:
      description: Unexpected server error (urn:hs:problem:internal). Never includes internals.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: Endpoint declared but not yet served (urn:hs:problem:not-implemented).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Owning replica unreachable, store unavailable, or read-only during cutover (urn:hs:problem:unavailable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, used for every /api/v1 error.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: urn:hs:problem:<slug> from the closed catalog in RFC 0004 section 3.5.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
          description: ULID; matches X-Request-Id and tracing spans.
        errcode:
          type: string
          description: The Matrix error code, present whenever a Matrix client could observe the same failure.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        retry_after_ms:
          type: integer
        required_scope:
          type: string
    ValidationError:
      type: object
      required:
      - pointer
      - detail
      properties:
        pointer:
          type: string
          description: JSON Pointer into the body, or param:<name> for a query parameter.
        detail:
          type: string
    PageEnvelope:
      type: object
      required:
      - next_cursor
      - prev_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          description: Present only when include_total=true and the count is cheap.
    ResourceRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: 'Open enum: user, device, room, event, media, appservice, destination, report, registration_token, task, replica, config_section, migration, server_key, server_notice.'
        id:
          type: string
    Actor:
      type: object
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - user
          - client
          - service_account
          - system
        id:
          type: string
        display_name:
          type: string
        token_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
    Principal:
      type: object
      description: The authenticated caller, as returned by GET /me.
      required:
      - kind
      - id
      - scopes
      properties:
        kind:
          type: string
          enum:
          - user
          - client
          - service_account
          - legacy
        id:
          type: string
        display_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        token_id:
          type: string
        expires_at:
          type: string
          format: date-time
        issued_by:
          type: string
    Task:
      type: object
      required:
      - id
      - action
      - status
      - created_at
      properties:
        id:
          type: string
        action:
          type: string
          description: Open enum, e.g. room.delete, room.purge_history, user.redact_events, user.deactivate, media.delete, media.purge_remote_cache, appservice.replay, migration.copy, migration.verify, migration.cutover, federation.refetch_keys.
        status:
          type: string
          enum:
          - scheduled
          - running
          - succeeded
          - failed
          - cancelled
        resource:
          $ref: '#/components/schemas/ResourceRef'
        progress:
          type:
          - object
          - 'null'
          properties:
            current:
              type: integer
            total:
              type: integer
            unit:
              type: string
            message:
              type: string
        result: {}
        error:
          anyOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        scheduled_for:
          type:
          - string
          - 'null'
          format: date-time
        created_by:
          $ref: '#/components/schemas/Actor'
    AuditEntry:
      type: object
      required:
      - id
      - recorded_at
      - action
      - actor
      - target
      - outcome
      properties:
        id:
          type: string
        recorded_at:
          type: string
          format: date-time
        action:
          type: string
          description: <resource>.<verb> operation id.
        actor:
          $ref: '#/components/schemas/Actor'
        target:
          $ref: '#/components/schemas/ResourceRef'
        request:
          type: object
          properties:
            method:
              type: string
            path:
              type: string
            request_id:
              type: string
            idempotency_key:
              type: string
            body:
              description: Secrets redacted, truncated at 64 KiB.
        outcome:
          type: object
          properties:
            status:
              type: integer
            problem:
              anyOf:
              - $ref: '#/components/schemas/Problem'
              - type: 'null'
        changes:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              from: {}
              to: {}
        replayed:
          type: boolean
        replay_of:
          type:
          - string
          - 'null'
    Event:
      type: object
      description: The JSON payload of one SSE frame's data field (see RFC 0004 section 10 for the taxonomy).
      required:
      - id
      - type
      - recorded_at
      properties:
        id:
          type: string
        type:
          type: string
          description: Namespaced, open enum, e.g. user.suspended, room.blocked, appservice.health_changed, task.progress, stream.reset.
        recorded_at:
          type: string
          format: date-time
        resource:
          $ref: '#/components/schemas/ResourceRef'
        actor:
          $ref: '#/components/schemas/Actor'
        data:
          type: object
          description: Type-specific payload; see the taxonomy table.
    User:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        admin:
          type: boolean
        deactivated:
          type: boolean
        erased:
          type: boolean
        locked:
          type: boolean
        suspended:
          type: boolean
        shadow_banned:
          type: boolean
        user_type:
          type:
          - string
          - 'null'
        consent_version:
          type:
          - string
          - 'null'
        appservice_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        device_count:
          type: integer
        room_count:
          type: integer
        media_count:
          type: integer
    UserCreate:
      type: object
      properties:
        localpart:
          type: string
        user_id:
          type: string
        password:
          type: string
        display_name:
          type: string
        admin:
          type: boolean
          default: false
        user_type:
          type: string
        threepids:
          type: array
          items:
            $ref: '#/components/schemas/ThreePid'
        external_ids:
          type: array
          items:
            $ref: '#/components/schemas/ExternalId'
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        avatar_url:
          type: string
        admin:
          type: boolean
        user_type:
          type:
          - string
          - 'null'
    Device:
      type: object
      required:
      - device_id
      properties:
        device_id:
          type: string
        display_name:
          type:
          - string
          - 'null'
        last_seen_ip:
          type:
          - string
          - 'null'
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
    Session:
      type: object
      required:
      - device_id
      - support_session
      properties:
        device_id:
          type: string
        display_name:
          type:
          - string
          - 'null'
        support_session:
          type: boolean
          description: A session an administrator minted with users.login_as.
        ip:
          type:
          - string
          - 'null'
          description: Redacted for moderation:* scopes.
        user_agent:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
    ThreePid:
      type: object
      required:
      - medium
      - address
      properties:
        medium:
          type: string
          enum:
          - email
          - msisdn
        address:
          type: string
        added_at:
          type: string
          format: date-time
    ExternalId:
      type: object
      required:
      - provider
      - external_id
      properties:
        provider:
          type: string
        external_id:
          type: string
    RateLimitOverride:
      type: object
      description: Replaces the server's rate_limits.message bucket for one user. messages_per_second 0 exempts the user. On PUT messages_per_second is required and burst_count defaults to 10.
      properties:
        messages_per_second:
          type: number
          minimum: 0
        burst_count:
          type: integer
          minimum: 1
    Room:
      type: object
      required:
      - room_id
      properties:
        room_id:
          type: string
        name:
          type:
          - string
          - 'null'
        topic:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        canonical_alias:
          type:
          - string
          - 'null'
        joined_members_count:
          type: integer
        local_members_count:
          type: integer
        state_events_count:
          type: integer
        version:
          type: string
        creator:
          type:
          - string
          - 'null'
        encrypted:
          type: boolean
        join_rule:
          type: string
        guest_access:
          type: string
        history_visibility:
          type: string
        federatable:
          type: boolean
        public:
          type: boolean
        room_type:
          type:
          - string
          - 'null'
        blocked:
          type: boolean
        blocked_reason:
          type:
          - string
          - 'null'
        tombstoned:
          type: boolean
        replacement_room_id:
          type:
          - string
          - 'null'
        forgotten:
          type: boolean
    RoomMember:
      type: object
      properties:
        room_id:
          type: string
