        provisioning_note:
          type:
          - string
          - 'null'
          description: What that surface means for an administrator, in words.
        sign_in:
          type: object
          description: The bridge's own documented login flow. `{bot}` in a step stands for the bridge bot's Matrix ID, which the interface substitutes.
          properties:
            steps:
              type: array
              items:
                type: string
            notes:
              type:
              - string
              - 'null'
    BridgeLogins:
      type: object
      description: Who has signed in to a bridge and as what, as the bridge's provisioning API says.
      required:
