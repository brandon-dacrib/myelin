        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /audit-log:
    get:
      summary: List audit entries
      operationId: audit_log.list
      tags:
      - AuditLog
      security:
      - OAuth2:
        - admin:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeTotal'
      - name: actor
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: target_type
        in: query
        schema:
          type: string
      - name: target_id
        in: query
        schema:
          type: string
      - name: outcome
        in: query
        schema:
          type: string
          enum:
          - success
          - failure
      - name: recorded_after
        in: query
        schema:
          type: string
          format: date-time
      - name: recorded_before
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
